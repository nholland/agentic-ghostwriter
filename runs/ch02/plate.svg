<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 466" style="color:#1a1a1a" role="img" aria-label="The Mood Mirror">
  <style>
    .ttl{font:600 22px Georgia,serif;letter-spacing:.20em;text-anchor:middle}
    .sub{font:italic 18px Georgia,serif;text-anchor:middle;opacity:.74}
    .lbl{font:600 17px Georgia,serif;letter-spacing:.14em;text-anchor:middle}
    .lbls{font:600 17px Georgia,serif;letter-spacing:.14em;text-anchor:start;opacity:.86}
    .lble{font:600 17px Georgia,serif;letter-spacing:.14em;text-anchor:end;opacity:.86}
    .cap{font:italic 18px Georgia,serif;opacity:.66;text-anchor:middle}
    .rule{stroke:currentColor;stroke-width:.8;opacity:.28}
  </style>

  <rect x="0" y="0" width="640" height="466" fill="#ffffff"/>

  <g fill="currentColor">
    <text class="ttl" x="320" y="44">THE MOOD MIRROR</text>
    <text class="sub" x="320" y="80">When her mood sets your mood,</text>
    <text class="sub" x="320" y="104">you've outsourced your peace.</text>
  </g>

  <!-- the evening with nothing of yours in it: her weather comes in, and leaves twice as heavy -->
  <g fill="currentColor">
    <text class="lbls" x="60" y="158">HER WEATHER</text>
    <text class="lble" x="580" y="158">THE STORM DOUBLES</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-linecap="round">
    <path d="M60 182h260" stroke-width="1.5"/>
    <path d="M320 182h260" stroke-width="5"/>
  </g>

  <g class="rule" fill="none"><path d="M44 226h552"/></g>

  <!-- the same evening, with one thing of yours planted in it: the line comes out the weight it went in -->
  <g fill="currentColor">
    <text class="lbls" x="60" y="274">HER WEATHER</text>
    <text class="lbl" x="320" y="360">YOUR OWN WEATHER</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-linecap="round">
    <path d="M60 310h520" stroke-width="1.5"/>
    <path d="M320 286v48" stroke-width="5"/>
  </g>

  <g class="rule" fill="none"><path d="M44 382h552"/></g>

  <g fill="currentColor">
    <text class="cap" x="320" y="416">Not to go cold.</text>
    <text class="cap" x="320" y="440">To bring something real through the door.</text>
  </g>
</svg>
