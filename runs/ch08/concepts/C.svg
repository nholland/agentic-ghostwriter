<!-- ROUGH THUMBNAIL, concept C. Not a deliverable plate. Carrier: one surfaced
     moment, and which way it points decides which tool you pick up. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" style="color:#1a1a1a" role="img" aria-label="The Tipping Scale, concept C">
  <style>
    .ttl{font:600 17px Georgia,serif;letter-spacing:.20em;text-anchor:middle}
    .sub{font:italic 13.5px Georgia,serif;text-anchor:middle;opacity:.74}
    .lblc{font:600 13px Georgia,serif;letter-spacing:.16em;text-anchor:middle}
    .cap{font:italic 12px Georgia,serif;opacity:.66;text-anchor:middle}
    .capl{font:italic 12px Georgia,serif;opacity:.66;text-anchor:start}
    .rule{stroke:currentColor;stroke-width:.8;opacity:.28}
    .ln{stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}
    .thin{stroke:currentColor;stroke-width:1.2;fill:none;opacity:.7}
  </style>

  <rect x="0" y="0" width="640" height="430" fill="#ffffff"/>

  <g fill="currentColor">
    <text class="ttl" x="320" y="40">THE TIPPING SCALE</text>
    <text class="sub" x="320" y="66">Which way the weight points decides what you do.</text>
  </g>

  <!-- the moment it surfaces -->
  <g fill="currentColor"><rect x="310" y="104" width="20" height="14"/></g>
  <g fill="currentColor">
    <text class="cap" x="320" y="96">the day it finally surfaces</text>
  </g>
  <g class="thin" stroke="currentColor">
    <path d="M314 120 176 164"/>
    <path d="M326 120 464 164"/>
  </g>

  <!-- LEFT: her complaint lands on you -->
  <g fill="currentColor">
    <text class="lblc" x="176" y="186">IT LANDS ON YOU</text>
  </g>
  <g class="ln" stroke="currentColor">
    <path d="M110 200v104"/>
    <path d="M110 244h36"/>
    <path d="M110 296h36"/>
  </g>
  <g fill="currentColor"><rect x="146" y="238" width="48" height="12"/></g>
  <g class="ln" stroke="currentColor"><path d="M146 296h48"/></g>
  <g fill="currentColor">
    <text class="capl" x="202" y="248">true, so you change it</text>
    <text class="capl" x="202" y="300">not true, so you say it</text>
    <text class="capl" x="202" y="316">once, without heat</text>
  </g>

  <!-- RIGHT: the uncredited work is yours -->
  <g fill="currentColor">
    <text class="lblc" x="470" y="186">IT IS YOURS</text>
  </g>
  <g class="ln" stroke="currentColor"><path d="M400 258h86"/></g>
  <g fill="currentColor"><circle cx="404" cy="258" r="6"/></g>
  <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 5" opacity=".45">
    <rect x="510" y="244" width="58" height="28" fill="none"/>
  </g>
  <g fill="currentColor">
    <text class="capl" x="398" y="216">already paid, the moment</text>
    <text class="capl" x="398" y="232">you did it</text>
    <text class="cap" x="512" y="296">her noticing, which is</text>
    <text class="cap" x="512" y="312">a separate thing</text>
  </g>

  <g class="rule" fill="none"><path d="M44 388h552"/></g>
  <g fill="currentColor">
    <text class="cap" x="320" y="412">Two directions, two tools, and no third thing to wait for.</text>
  </g>
</svg>
