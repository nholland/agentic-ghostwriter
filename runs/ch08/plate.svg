<!-- Chapter 8 plate, round 3, drawn from concept A (the Reader Panel's pick).
     Carrier: the same small weights land on two identical scales. On the left
     nothing counts them, so they funnel into one pan and it tips. On the right
     each one is stopped the moment it lands, by one of the chapter's two tools,
     so the weights are still there and the scale holds level. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" style="color:#1a1a1a" role="img" aria-label="The Tipping Scale">
  <style>
    .ttl{font:600 17px Georgia,serif;letter-spacing:.20em;text-anchor:middle}
    .sub{font:italic 13.5px Georgia,serif;text-anchor:middle;opacity:.74}
    .lblc{font:600 13px Georgia,serif;letter-spacing:.16em;text-anchor:middle}
    .dir{font:600 11px Georgia,serif;letter-spacing:.14em;text-anchor:middle;opacity:.9}
    .tool{font:12px Georgia,serif;text-anchor:middle;opacity:.82}
    .cap{font:italic 12px Georgia,serif;opacity:.66;text-anchor:middle}
    .rule{stroke:currentColor;stroke-width:.8;opacity:.28}
    .ln{stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .fall{stroke:currentColor;stroke-width:1.1;fill:none;stroke-dasharray:3 5;opacity:.45}
    .stop{stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}
  </style>

  <rect x="0" y="0" width="640" height="430" fill="#ffffff"/>

  <g fill="currentColor">
    <text class="ttl" x="320" y="40">THE TIPPING SCALE</text>
    <text class="sub" x="320" y="66">Unfairness rarely arrives as one moment.</text>
  </g>

  <!-- column names -->
  <g fill="currentColor">
    <text class="lblc" x="168" y="120">UNCOUNTED</text>
    <text class="lblc" x="472" y="120">NAMED</text>
  </g>

  <!-- LEFT: the same small things, falling, nothing counting them -->
  <g fill="currentColor" opacity=".62">
    <circle cx="88" cy="140" r="3"/>
    <circle cx="120" cy="140" r="3"/>
    <circle cx="152" cy="140" r="3"/>
    <circle cx="184" cy="140" r="3"/>
    <circle cx="216" cy="140" r="3"/>
    <circle cx="248" cy="140" r="3"/>
  </g>
  <g class="fall">
    <path d="M88 148 82 300"/>
    <path d="M120 148 92 300"/>
    <path d="M152 148 102 300"/>
    <path d="M184 148 112 300"/>
    <path d="M216 148 122 300"/>
    <path d="M248 148 132 300"/>
  </g>

  <!-- RIGHT: the same small things, each stopped where it lands -->
  <g fill="currentColor" opacity=".62">
    <circle cx="392" cy="140" r="3"/>
    <circle cx="424" cy="140" r="3"/>
    <circle cx="456" cy="140" r="3"/>
    <circle cx="488" cy="140" r="3"/>
    <circle cx="520" cy="140" r="3"/>
    <circle cx="552" cy="140" r="3"/>
  </g>
  <g class="stop">
    <path d="M383 150h18"/>
    <path d="M415 150h18"/>
    <path d="M447 150h18"/>
    <path d="M479 150h18"/>
    <path d="M511 150h18"/>
    <path d="M543 150h18"/>
  </g>

  <!-- what the stopping is, in the two directions it comes from -->
  <g fill="currentColor">
    <text class="dir" x="472" y="188">WHEN IT LANDS ON YOU</text>
    <text class="tool" x="472" y="208">is it true, or not true?</text>
    <text class="dir" x="472" y="240">WHEN IT'S YOURS</text>
    <text class="tool" x="472" y="260">the work already paid itself</text>
  </g>

  <!-- the left scale: one loaded pan, and it has tipped -->
  <g class="ln" stroke="currentColor">
    <path d="M168 296 153 346h30z"/>
    <path d="M147 346h42"/>
    <path d="M88 318 248 274"/>
    <path d="M88 318 66 340"/><path d="M88 318 110 340"/>
    <path d="M66 340q22 14 44 0"/>
    <path d="M248 274 226 296"/><path d="M248 274 270 296"/>
    <path d="M226 296q22 14 44 0"/>
  </g>
  <g fill="currentColor" opacity=".62">
    <circle cx="74" cy="338" r="2.8"/><circle cx="82" cy="338" r="2.8"/>
    <circle cx="90" cy="338" r="2.8"/><circle cx="98" cy="338" r="2.8"/>
    <circle cx="106" cy="338" r="2.8"/>
    <circle cx="78" cy="331" r="2.8"/><circle cx="86" cy="331" r="2.8"/>
    <circle cx="94" cy="331" r="2.8"/><circle cx="102" cy="331" r="2.8"/>
    <circle cx="82" cy="324" r="2.8"/><circle cx="90" cy="324" r="2.8"/>
    <circle cx="98" cy="324" r="2.8"/>
  </g>

  <!-- the right scale: the same weight arrived, and it holds level -->
  <g class="ln" stroke="currentColor">
    <path d="M472 296 457 346h30z"/>
    <path d="M451 346h42"/>
    <path d="M392 296 552 296"/>
    <path d="M392 296 370 318"/><path d="M392 296 414 318"/>
    <path d="M370 318q22 14 44 0"/>
    <path d="M552 296 530 318"/><path d="M552 296 574 318"/>
    <path d="M530 318q22 14 44 0"/>
  </g>

  <g fill="currentColor">
    <text class="cap" x="168" y="370">One day something small tips it.</text>
    <text class="cap" x="472" y="370">Name it to yourself right then.</text>
  </g>

  <g class="rule" fill="none"><path d="M44 388h552"/></g>

  <g fill="currentColor">
    <text class="cap" x="320" y="402">It's small things you never counted,</text>
    <text class="cap" x="320" y="420">tipping quietly until you finally feel the weight.</text>
  </g>
</svg>
