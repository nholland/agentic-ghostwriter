<!-- Chapter 8 plate, round 4 (outside-reader round, 2026-09-21).
     Carrier unchanged: the same small weights land on two identical scales.
     Re-weighted so the grammar is one rule everywhere on the plate: faint = it
     landed and nothing counted it, dark = it was named as it landed. On the
     left, eleven faint weights nobody counted and one dark one, the only one
     you noticed, and the beam has already gone over. On the right every weight
     is named as it arrives, so none of them pile and the beam holds level. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" style="color:#1a1a1a" role="img" aria-label="The Tipping Scale">
  <style>
    .ttl{font:600 17px Georgia,serif;letter-spacing:.20em;text-anchor:middle}
    .sub{font:italic 13.5px Georgia,serif;text-anchor:middle;opacity:.74}
    .lbl{font:600 13px Georgia,serif;letter-spacing:.16em;text-anchor:start}
    .cap{font:italic 12px Georgia,serif;opacity:.66;text-anchor:middle}
    .ln{stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .fall{stroke:currentColor;stroke-width:1.1;fill:none;stroke-dasharray:3 5;opacity:.2}
    .last{stroke:currentColor;stroke-width:1.3;fill:none;opacity:.7;stroke-dasharray:3 5}
  </style>

  <rect x="0" y="0" width="640" height="352" fill="#ffffff"/>

  <g fill="currentColor">
    <text class="ttl" x="320" y="44">THE TIPPING SCALE</text>
    <text class="sub" x="320" y="70">Unfairness rarely arrives as one moment.</text>
  </g>

  <g fill="currentColor">
    <text class="lbl" x="44" y="112">UNCOUNTED</text>
    <text class="lbl" x="348" y="112">NAMED WHEN IT LANDS</text>
  </g>

  <!-- LEFT: the same six small things arrive, and five of them register on
       nobody. Only the last one is dark, because it is the only one you saw. -->
  <g fill="currentColor" opacity=".22">
    <circle cx="88" cy="160" r="3"/>
    <circle cx="120" cy="160" r="3"/>
    <circle cx="152" cy="160" r="3"/>
    <circle cx="184" cy="160" r="3"/>
    <circle cx="216" cy="160" r="3"/>
  </g>
  <g fill="currentColor">
    <circle cx="248" cy="160" r="3.8"/>
  </g>
  <g class="fall">
    <path d="M88 168 98 252"/>
    <path d="M120 168 102 252"/>
    <path d="M152 168 106 252"/>
    <path d="M184 168 108 252"/>
    <path d="M216 168 110 252"/>
  </g>
  <g class="last">
    <path d="M248 168 112 246"/>
  </g>

  <!-- RIGHT: every one of them is named the moment it lands, so every one of
       them is dark. The trajectories are cut: on this side they crossed each
       other and said nothing the dark weights do not already say. -->
  <g fill="currentColor" opacity=".85">
    <circle cx="392" cy="160" r="3"/>
    <circle cx="424" cy="160" r="3"/>
    <circle cx="456" cy="160" r="3"/>
    <circle cx="488" cy="160" r="3"/>
    <circle cx="520" cy="160" r="3"/>
    <circle cx="552" cy="160" r="3"/>
  </g>
  <!-- the left scale: weeks of uncounted weight in one pan, and it has gone over -->
  <g class="ln" stroke="currentColor">
    <path d="M168 236 153 286h30z"/>
    <path d="M147 286h42"/>
    <path d="M108 254 228 218"/>
    <path d="M108 254 86 278"/><path d="M108 254 130 278"/>
    <path d="M86 278q22 24 44 0"/>
    <path d="M228 218 206 240"/><path d="M228 218 250 240"/>
    <path d="M206 240q22 14 44 0"/>
  </g>
  <g fill="currentColor" opacity=".24">
    <circle cx="96" cy="282" r="2.8"/><circle cx="104" cy="282" r="2.8"/>
    <circle cx="112" cy="282" r="2.8"/><circle cx="120" cy="282" r="2.8"/>
    <circle cx="100" cy="275" r="2.8"/><circle cx="108" cy="275" r="2.8"/>
    <circle cx="116" cy="275" r="2.8"/>
  </g>
  <g fill="currentColor">
    <circle cx="108" cy="268" r="3.2"/>
  </g>

  <!-- the right scale: the same weight arrived, each piece named, and it holds level -->
  <g class="ln" stroke="currentColor">
    <path d="M472 236 457 286h30z"/>
    <path d="M451 286h42"/>
    <path d="M412 236 532 236"/>
    <path d="M412 236 390 258"/><path d="M412 236 434 258"/>
    <path d="M390 258q22 14 44 0"/>
    <path d="M532 236 510 258"/><path d="M532 236 554 258"/>
    <path d="M510 258q22 14 44 0"/>
  </g>
  <g fill="currentColor" opacity=".85">
    <circle cx="396" cy="254" r="2.8"/><circle cx="412" cy="254" r="2.8"/>
    <circle cx="428" cy="254" r="2.8"/>
    <circle cx="516" cy="254" r="2.8"/><circle cx="532" cy="254" r="2.8"/>
    <circle cx="548" cy="254" r="2.8"/>
  </g>

  <g fill="currentColor">
    <text class="cap" x="320" y="330">The last pebble is rarely the whole weight.</text>
  </g>
</svg>
