<!-- Round 2, 2026-09-20. The chapter plate, not the source file. Two changes
     from design/plates/tipping-scale.svg: the weight labelled "the one that
     finally tipped it" sits on the loaded side (Ch8's prose says the last one
     is another small one landing on the same pile), and the Reader Panel's
     edits are applied: the second pan is named, the bottom line is plainer,
     and the corrective is on the plate. design/plates/tipping-scale.svg is
     unchanged by this desk. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" style="color:#1a1a1a" role="img" aria-label="The Tipping Scale">
  <style>
    .ttl{font:600 17px Georgia,serif;letter-spacing:.20em;text-anchor:middle}
    .sub{font:italic 13.5px Georgia,serif;text-anchor:middle;opacity:.74}
    .lbl{font:600 14px Georgia,serif;letter-spacing:.16em;text-anchor:start}
    .txt{font:14px Georgia,serif;opacity:.86;text-anchor:start}
    .cap{font:italic 12px Georgia,serif;opacity:.66;text-anchor:middle}
    .capl{font:italic 12px Georgia,serif;opacity:.66;text-anchor:start}
    .rule{stroke:currentColor;stroke-width:.8;opacity:.28}
  </style>

  <rect x="0" y="0" width="640" height="350" fill="#ffffff"/>

  <g fill="currentColor">
    <text class="ttl" x="320" y="40">THE TIPPING SCALE</text>
    <text class="sub" x="320" y="66">The tip feels sudden. It never is.</text>
  </g>

  <g stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M320 182 296 262h48z"/>
    <path d="M278 262h84"/>
    <path d="M160 206 480 158"/>
    <path d="M160 206v24"/><path d="M480 158v24"/>
    <path d="M128 230h64"/><path d="M448 182h64"/>
  </g>
  <g fill="currentColor" opacity=".55">
    <circle cx="133.9" cy="223.2" r="2.7"/>
    <circle cx="142.2" cy="223.3" r="2.7"/>
    <circle cx="148.8" cy="223.2" r="2.7"/>
    <circle cx="155.6" cy="223.3" r="2.7"/>
    <circle cx="163.9" cy="222.9" r="2.7"/>
    <circle cx="170.2" cy="223.6" r="2.7"/>
    <circle cx="177.6" cy="222.9" r="2.7"/>
    <circle cx="186.2" cy="223.9" r="2.7"/>
    <circle cx="135.0" cy="215.2" r="2.7"/>
    <circle cx="141.7" cy="215.7" r="2.7"/>
    <circle cx="148.1" cy="216.6" r="2.7"/>
    <circle cx="156.3" cy="216.5" r="2.7"/>
    <circle cx="163.0" cy="216.3" r="2.7"/>
    <circle cx="170.1" cy="216.0" r="2.7"/>
    <circle cx="178.3" cy="215.4" r="2.7"/>
    <circle cx="185.8" cy="215.7" r="2.7"/>
    <circle cx="134.0" cy="208.3" r="2.7"/>
    <circle cx="141.3" cy="208.8" r="2.7"/>
    <circle cx="149.8" cy="207.8" r="2.7"/>
    <circle cx="156.9" cy="208.2" r="2.7"/>
    <circle cx="163.2" cy="208.9" r="2.7"/>
    <circle cx="170.6" cy="209.1" r="2.7"/>
    <circle cx="178.9" cy="208.6" r="2.7"/>
    <circle cx="186.5" cy="208.7" r="2.7"/>
  </g>

  <!-- the last small one, still falling, on the side the weight is on -->
  <g fill="currentColor"><circle cx="160" cy="164" r="4.6"/></g>
  <g fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="3 5" opacity=".45">
    <path d="M160 172v26"/>
  </g>

  <g fill="currentColor">
    <text class="cap" x="160" y="146">the one that finally tipped it</text>
    <text class="cap" x="160" y="262">weeks of weight nobody saw land</text>
    <text class="cap" x="458" y="214">everything you told yourself was fine</text>
    <text class="cap" x="240" y="292">Name each one as it lands, and nothing has to tip.</text>
    <text class="cap" x="320" y="328">Arguing about the last one misses where the weight came from.</text>
  </g>
</svg>
