<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 366" style="color:#1a1a1a" role="img" aria-label="The Tally You Don't Read Aloud">
  <style>
    .ttl{font:600 20px Georgia,serif;letter-spacing:.20em;text-anchor:middle}
    .sub{font:italic 18px Georgia,serif;text-anchor:middle;opacity:.74}
    .lbls{font:600 17px Georgia,serif;letter-spacing:.14em;text-anchor:start;opacity:.86}
    .lble{font:600 17px Georgia,serif;letter-spacing:.14em;text-anchor:end;opacity:.86}
    .cap{font:italic 18px Georgia,serif;opacity:.66;text-anchor:middle}
    .rule{stroke:currentColor;stroke-width:.8;opacity:.28}
  </style>

  <rect x="0" y="0" width="640" height="366" fill="#ffffff"/>

  <g fill="currentColor">
    <text class="ttl" x="320" y="44">THE TALLY YOU DON’T READ ALOUD</text>
    <text class="sub" x="320" y="80">You are counting the week.</text>
    <text class="sub" x="320" y="104">She can only see tonight.</text>
  </g>

  <!-- the whole week, yours and real; only the stretch standing inside her
       view is solid, the rest of it is there and unseen. Faint means it landed
       and nothing counted it, which is the Ch8 grammar. -->
  <g stroke="currentColor">
    <rect x="76" y="188" width="412" height="40" fill="currentColor" stroke="none" opacity=".17"/>
    <rect x="488" y="188" width="76" height="40" fill="currentColor" stroke="none" opacity=".88"/>
    <rect x="488" y="176" width="80" height="64" fill="none" stroke-width="1.3" stroke-dasharray="4 5" opacity=".75"/>
  </g>

  <g fill="currentColor">
    <text class="lbls" x="76" y="164">THE WEEK</text>
    <text class="lble" x="568" y="164">TONIGHT</text>
  </g>

  <g class="rule" fill="none"><path d="M44 280h552"/></g>

  <g fill="currentColor">
    <text class="cap" x="320" y="314">Resentment grows when you expect someone</text>
    <text class="cap" x="320" y="340">to read a tally you never showed them.</text>
  </g>
</svg>
