<!-- Ch15 concept D (rebuild): three exchanges. In each row her edge comes in faint from HER to YOU, shaped by the test (jagged, tangled, broken off short); his reply goes back heavy and smooth from YOU to HER, arrowhead on her side, named for the virtue. Mirrored on 320. Weights: 1.4 quiet, 2 standard, 3.2 carrier. -->
