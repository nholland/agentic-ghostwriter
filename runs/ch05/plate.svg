<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" style="color:#1a1a1a" role="img" aria-label="The Remaining Nails">
  <style>
    .ttl{font:600 17px Georgia,serif;letter-spacing:.20em;text-anchor:middle}
    .sub{font:italic 13.5px Georgia,serif;text-anchor:middle;opacity:.74}
    .cap{font:italic 12px Georgia,serif;opacity:.66;text-anchor:middle}
    .rule{stroke:currentColor;stroke-width:.8;opacity:.28}
  </style>

  <rect x="0" y="0" width="640" height="430" fill="#ffffff"/>

  <g fill="currentColor">
    <text class="ttl" x="320" y="40">THE REMAINING NAILS</text>
    <text class="sub" x="320" y="66">An apology will end the fight. The nail will stay in.</text>
  </g>

  <!-- the board -->
  <g fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55">
    <rect x="110" y="230" width="420" height="26"/>
  </g>

  <!-- the four nobody came back for: still driven in -->
  <g stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="butt">
    <path d="M170 220v36"/><path d="M232 220v36"/>
    <path d="M294 220v36"/><path d="M356 220v36"/>
    <path d="M162 220h16"/><path d="M224 220h16"/>
    <path d="M286 220h16"/><path d="M348 220h16"/>
  </g>

  <!-- the one that came out, lying blunt beside the hole it left -->
  <g stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="butt">
    <path d="M424 200h36"/>
    <path d="M424 192v16"/>
  </g>
  <g fill="currentColor">
    <circle cx="452" cy="243" r="4"/>
  </g>

  <g fill="currentColor">
    <text class="cap" x="455" y="168">the one you went back and said</text>
    <text class="cap" x="252" y="296">every fight that ended before the real thing got said</text>
  </g>

  <g class="rule" fill="none"><path d="M44 350h552"/></g>

  <g fill="currentColor">
    <text class="cap" x="320" y="388">Parrhesia, frank speech: said once you are calm. How it lands is hers.</text>
  </g>
</svg>
