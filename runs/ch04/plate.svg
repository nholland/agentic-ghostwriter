<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" style="color:#1a1a1a" role="img" aria-label="The Hole Maker">
  <style>
    .ttl{font:600 17px Georgia,serif;letter-spacing:.20em;text-anchor:middle}
    .sub{font:italic 13.5px Georgia,serif;text-anchor:middle;opacity:.74}
    .lbl{font:600 12.5px Georgia,serif;letter-spacing:.14em;text-anchor:start;opacity:.86}
    .cap{font:italic 12px Georgia,serif;opacity:.66;text-anchor:middle}
    .capb{font:italic 13.5px Georgia,serif;opacity:.74;text-anchor:middle}
    .rule{stroke:currentColor;stroke-width:.8;opacity:.28}
  </style>

  <rect x="0" y="0" width="640" height="396" fill="#ffffff"/>

  <g fill="currentColor">
    <text class="ttl" x="320" y="40">THE HOLE MAKER</text>
    <text class="sub" x="320" y="70">Anger isn't strength.</text>
  </g>

  <!-- the post the day it happens: nails driven through it -->
  <g fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55">
    <rect x="216" y="112" width="344" height="26"/>
  </g>
  <g stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M258 102v36"/><path d="M300 102v36"/><path d="M356 102v36"/>
    <path d="M414 102v36"/><path d="M470 102v36"/>
    <path d="M250 102h16"/><path d="M292 102h16"/><path d="M348 102h16"/>
    <path d="M406 102h16"/><path d="M462 102h16"/>
  </g>

  <!-- the same post after the apology: the nails are gone, the holes are not -->
  <g fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55">
    <rect x="216" y="190" width="344" height="26"/>
  </g>
  <g fill="currentColor">
    <circle cx="258" cy="203" r="4"/><circle cx="300" cy="203" r="4"/>
    <circle cx="356" cy="203" r="4"/><circle cx="414" cy="203" r="4"/>
    <circle cx="470" cy="203" r="4"/>
  </g>

  <!-- the same post months on: the first five holes, and the ones that came after -->
  <g fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55">
    <rect x="216" y="268" width="344" height="26"/>
  </g>
  <g fill="currentColor">
    <circle cx="242" cy="281" r="4"/><circle cx="270" cy="281" r="4"/>
    <circle cx="300" cy="281" r="4"/><circle cx="330" cy="281" r="4"/>
    <circle cx="356" cy="281" r="4"/><circle cx="384" cy="281" r="4"/>
    <circle cx="414" cy="281" r="4"/><circle cx="442" cy="281" r="4"/>
    <circle cx="470" cy="281" r="4"/><circle cx="500" cy="281" r="4"/>
  </g>

  <g fill="currentColor">
    <text class="lbl" x="44" y="129">THE OUTBURST</text>
    <text class="lbl" x="44" y="207">THE APOLOGY</text>
    <text class="lbl" x="44" y="285">MONTHS ON</text>
  </g>

  <g fill="currentColor">
    <text class="cap" x="388" y="158">Every outburst drives a nail.</text>
    <text class="cap" x="388" y="236">An apology can pull it out.</text>
    <text class="cap" x="388" y="314">The hole remains.</text>
  </g>

  <g class="rule" fill="none"><path d="M44 340h552"/></g>

  <g fill="currentColor">
    <text class="capb" x="320" y="370">Stop making holes.</text>
  </g>
</svg>
