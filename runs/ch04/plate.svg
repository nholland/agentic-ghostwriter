<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" style="color:#1a1a1a" role="img" aria-label="The Hole Maker">
  <!-- 2026-11-07: type re-set for phone width (author ruling "1. Enlarge").
       Posts centred on the axis, each label above its post and each caption
       under it; drawing and words unchanged. The closing line stays on one
       line because a second italic line would exceed the caption cap. -->
  <style>
    .ttl{font:600 22px Georgia,serif;letter-spacing:.20em;text-anchor:middle}
    .sub{font:italic 18px Georgia,serif;text-anchor:middle;opacity:.74}
    .lbl{font:600 17px Georgia,serif;letter-spacing:.12em;text-anchor:start;opacity:.86}
    .cap{font:italic 18px Georgia,serif;opacity:.66;text-anchor:middle}
    .capb{font:italic 14.5px Georgia,serif;opacity:.74;text-anchor:middle}
    .rule{stroke:currentColor;stroke-width:.8;opacity:.28}
  </style>

  <rect x="0" y="0" width="640" height="520" fill="#ffffff"/>

  <g fill="currentColor">
    <text class="ttl" x="320" y="44">THE HOLE MAKER</text>
    <text class="sub" x="320" y="78">Anger isn’t strength.</text>
  </g>

  <!-- the post the day it happens: nails driven through it -->
  <g fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55">
    <rect x="148" y="160" width="344" height="26"/>
  </g>
  <g stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M190 150v36"/><path d="M232 150v36"/><path d="M288 150v36"/>
    <path d="M346 150v36"/><path d="M402 150v36"/>
    <path d="M182 150h16"/><path d="M224 150h16"/><path d="M280 150h16"/>
    <path d="M338 150h16"/><path d="M394 150h16"/>
  </g>

  <!-- the same post after the apology: the nails are out, the openings they left are not -->
  <g fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55">
    <rect x="148" y="272" width="344" height="26"/>
  </g>
  <g fill="#ffffff" stroke="currentColor" stroke-width="1.8">
    <circle cx="190" cy="285" r="6.5"/><circle cx="232" cy="285" r="6.5"/>
    <circle cx="288" cy="285" r="6.5"/><circle cx="346" cy="285" r="6.5"/>
    <circle cx="402" cy="285" r="6.5"/>
  </g>

  <!-- the same post months on: the earlier openings, and the ones that came after -->
  <g fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55">
    <rect x="148" y="384" width="344" height="26"/>
  </g>
  <g fill="#ffffff" stroke="currentColor" stroke-width="1.8">
    <circle cx="174" cy="397" r="6.5"/><circle cx="202" cy="397" r="6.5"/>
    <circle cx="232" cy="397" r="6.5"/><circle cx="262" cy="397" r="6.5"/>
    <circle cx="288" cy="397" r="6.5"/><circle cx="316" cy="397" r="6.5"/>
    <circle cx="346" cy="397" r="6.5"/><circle cx="374" cy="397" r="6.5"/>
    <circle cx="402" cy="397" r="6.5"/><circle cx="432" cy="397" r="6.5"/>
  </g>

  <g fill="currentColor">
    <text class="lbl" x="148" y="134">THE OUTBURST</text>
    <text class="lbl" x="148" y="258">THE APOLOGY</text>
    <text class="lbl" x="148" y="370">MONTHS ON</text>
  </g>

  <g fill="currentColor">
    <text class="cap" x="320" y="212">Every outburst drives a nail.</text>
    <text class="cap" x="320" y="324">An apology can pull it out.</text>
    <text class="cap" x="320" y="436">It's full of holes.</text>
  </g>

  <g class="rule" fill="none"><path d="M44 464h552"/></g>

  <g fill="currentColor">
    <text class="capb" x="320" y="496">Sometimes it’s cold, and cold is often worse. Both make holes.</text>
  </g>
</svg>
