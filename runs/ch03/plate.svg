<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 496" style="color:#1a1a1a" role="img" aria-label="The Closed Door">
  <style>
    .ttl{font:600 22px Georgia,serif;letter-spacing:.20em;text-anchor:middle}
    .sub{font:italic 18px Georgia,serif;text-anchor:middle;opacity:.74}
    .lbl{font:600 17px Georgia,serif;letter-spacing:.12em;text-anchor:start;opacity:.86}
    .cap{font:italic 18px Georgia,serif;opacity:.66;text-anchor:middle}
    .rule{stroke:currentColor;stroke-width:.8;opacity:.28}
  </style>

  <rect x="0" y="0" width="640" height="496" fill="#ffffff"/>

  <g fill="currentColor">
    <text class="ttl" x="320" y="44">THE CLOSED DOOR</text>
    <text class="sub" x="320" y="80">Defend yourself enough times,</text>
    <text class="sub" x="320" y="104">and she stops bringing you the truth.</text>
  </g>

  <!-- the same doorway four times, closing from the right by degrees, until it is shut.
       2026-11-07: labels moved above their bars so they can be set at phone size. -->
  <g stroke="currentColor" stroke-width="1.2">
    <rect x="88" y="158" width="464" height="30" fill="none" opacity=".5"/>
    <rect x="88" y="228" width="464" height="30" fill="none" opacity=".5"/>
    <rect x="88" y="298" width="464" height="30" fill="none" opacity=".5"/>
    <rect x="88" y="368" width="464" height="30" fill="none" opacity=".5"/>
    <rect x="397" y="228" width="155" height="30" fill="currentColor" stroke="none" opacity=".85"/>
    <rect x="243" y="298" width="309" height="30" fill="currentColor" stroke="none" opacity=".85"/>
    <rect x="88" y="368" width="464" height="30" fill="currentColor" stroke="none" opacity=".85"/>
  </g>

  <g fill="currentColor">
    <text class="lbl" x="88" y="150">SHE BRINGS SOMETHING</text>
    <text class="lbl" x="88" y="220">YOU DEFEND</text>
    <text class="lbl" x="88" y="290">SHE UPDATES</text>
    <text class="lbl" x="88" y="360">SHE STOPS</text>
  </g>

  <g class="rule" fill="none"><path d="M44 430h552"/></g>

  <g fill="currentColor">
    <text class="cap" x="320" y="466">She's been keeping track longer than you know.</text>
  </g>
</svg>
