<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" style="color:#1a1a1a" role="img" aria-label="Keep learning her after you've won her">
<style>
.ttl{font:600 24px Georgia,serif;text-anchor:middle}
.lbl{font:600 17px Georgia,serif;text-anchor:middle}
.txt{font:19px Georgia,serif;text-anchor:middle}
.cap{font:italic 21px Georgia,serif;text-anchor:middle}
.ln{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rule{fill:none;stroke:currentColor;stroke-width:.8;opacity:.28}
</style>
<rect width="640" height="480" fill="#fff"/>
<text class="ttl" fill="currentColor" x="320" y="43">Keep learning her after you've won her</text>
<!-- carrier: two routes to the same question; memory stops short, asking arrives -->
<rect x="150" y="84" width="340" height="74" rx="4" fill="#fff" stroke="currentColor" stroke-width="1.4"/>
<text class="txt" fill="currentColor" x="320" y="116">one thing she'd be excited</text>
<text class="txt" fill="currentColor" x="320" y="143">about this Saturday</text>
<path class="ln" stroke-dasharray="6 7" opacity=".55" d="M176 286L228 220"/>
<path class="ln" opacity=".55" d="M217.8 212L238.2 228"/>
<path class="ln" d="M464 286L372 166M374.2 177.8L372 166M382.8 171.2L372 166"/>
<text class="lbl" fill="currentColor" x="176" y="314">what she liked</text>
<text class="lbl" fill="currentColor" x="176" y="336">at twenty-six</text>
<text class="lbl" fill="currentColor" x="464" y="314">So you ask her.</text>
<path class="rule" d="M64 361H576"/>
<text class="cap" fill="currentColor" x="320" y="405">She's changed across the years</text>
<text class="cap" fill="currentColor" x="320" y="437">you spent in the same house.</text>
</svg>
