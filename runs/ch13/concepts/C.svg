<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" style="color:#1a1a1a" role="img" aria-label="Keep learning what matters to her">
<style>.ttl{font:600 25px Georgia,serif;text-anchor:middle}.sub{font:italic 19px Georgia,serif;text-anchor:middle;opacity:.78}.lbl{font:600 21px Georgia,serif;text-anchor:middle}.txt{font:21px Georgia,serif;text-anchor:middle}.cap{font:italic 20px Georgia,serif;text-anchor:middle}.ln{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.faint{opacity:.35}</style>
<rect width="640" height="560" fill="#fff"/>
<text class="ttl" fill="currentColor" x="320" y="43">Keep learning what matters to her</text>
<text class="sub" fill="currentColor" x="320" y="79">She&#x27;s still becoming. You&#x27;ve changed too.</text>
<text class="lbl" fill="currentColor" x="178" y="144">Let her finish.</text>
<text class="lbl" fill="currentColor" x="462" y="144">When you talk later,</text>
<g transform="translate(116,236) scale(1,1)" class="ln"><path fill="#fff" d="M-12-24C-34-27-35 9-14 14L-15 27M-12-24C1-24 7-13 6-6L14 2L6 5L5 13L-6 15"/><path fill="none" d="M-14 27Q-43 35-43 66M-14 27Q2 32 6 62M-3 8Q1 10 5 8"/><circle cx="2" cy="-6" r="1.6" fill="currentColor" stroke="none"/></g><g transform="translate(228,236) scale(-1,1)" class="ln"><path fill="#fff" d="M-12-24C-34-27-35 9-14 14L-15 27M-12-24C1-24 7-13 6-6L14 2L6 5L5 13L-6 15"/><path fill="none" d="M-14 27Q-43 35-43 66M-14 27Q2 32 6 62M-3 8Q1 10 5 8"/><circle cx="2" cy="-6" r="1.6" fill="currentColor" stroke="none"/></g><g transform="translate(406,236) scale(1,1)" class="ln"><path fill="#fff" d="M-12-24C-34-27-35 9-14 14L-15 27M-12-24C1-24 7-13 6-6L14 2L6 5L5 13L-6 15"/><path fill="none" d="M-14 27Q-43 35-43 66M-14 27Q2 32 6 62M-3 8Q1 10 5 8"/><circle cx="2" cy="-6" r="1.6" fill="currentColor" stroke="none"/></g><g transform="translate(518,236) scale(-1,1)" class="ln"><path fill="#fff" d="M-12-24C-34-27-35 9-14 14L-15 27M-12-24C1-24 7-13 6-6L14 2L6 5L5 13L-6 15"/><path fill="none" d="M-14 27Q-43 35-43 66M-14 27Q2 32 6 62M-3 8Q1 10 5 8"/><circle cx="2" cy="-6" r="1.6" fill="currentColor" stroke="none"/></g><g class="ln"><path fill="#fff" d="M123 173H220V197H193L182 209V197H123Z"/><path fill="#fff" d="M413 173H510V197H483L472 209V197H413Z"/><path fill="none" d="M145 184H196M435 184H486M254 268H363M354 262L363 268L354 274"/></g><text class="txt" fill="currentColor" x="178" y="350">Say what you&#x27;re</text>
<text class="txt" fill="currentColor" x="178" y="378">glad about.</text>
<text class="txt" fill="currentColor" x="462" y="350">remember enough</text>
<text class="txt" fill="currentColor" x="462" y="378">to return to it.</text>
<path class="ln" fill="none" opacity=".28" d="M64 422H576"/><text class="cap" fill="currentColor" x="320" y="466">Curiosity becomes warmth</text>
<text class="cap" fill="currentColor" x="320" y="496">in how you receive the answer.</text>

</svg>
