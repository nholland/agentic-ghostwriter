<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" style="color:#1a1a1a" role="img" aria-label="Keep learning her after you've won her">
<style>
.ttl{font:600 24px Georgia,serif;text-anchor:middle}
.lbl{font:600 17px Georgia,serif;text-anchor:middle}
.txt{font:16px Georgia,serif;text-anchor:middle}
.cap{font:italic 21px Georgia,serif;text-anchor:middle}
.ln{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rule{fill:none;stroke:currentColor;stroke-width:.8;opacity:.28}
</style>
<rect width="640" height="480" fill="#fff"/>
<text class="ttl" fill="currentColor" x="320" y="43">Keep learning her after you've won her</text>
<text class="lbl" fill="currentColor" x="176" y="104">when you were dating</text>
<text class="lbl" fill="currentColor" x="464" y="104">now</text>
<!-- carrier: the unknown is still there; the questions pointing into it are gone -->
<circle cx="176" cy="212" r="64" fill="#fff" stroke="currentColor" stroke-width="2"/>
<circle cx="176" cy="212" r="18" fill="currentColor" opacity=".22"/>
<path class="ln" d="M102.5 138.5L125.1 161.1M122.0 151.6L125.1 161.1M115.6 158.0L125.1 161.1M249.5 138.5L226.9 161.1M236.4 158.0L226.9 161.1M230.0 151.6L226.9 161.1M249.5 285.5L226.9 262.9M230.0 272.4L226.9 262.9M236.4 266.0L226.9 262.9M102.5 285.5L125.1 262.9M115.6 266.0L125.1 262.9M122.0 272.4L125.1 262.9"/>
<circle cx="464" cy="212" r="84" fill="#fff" stroke="currentColor" stroke-width="2"/>
<circle cx="464" cy="212" r="52" fill="currentColor" opacity=".22"/>
<text class="txt" fill="currentColor" x="464" y="218">at twenty-six</text>
<text class="cap" fill="currentColor" x="176" y="334">you wanted the answers</text>
<text class="cap" fill="currentColor" x="464" y="334">She's changed.</text>
<path class="rule" d="M64 361H576"/>
<text class="cap" fill="currentColor" x="320" y="412">What stopped was your curiosity about who she is now.</text>
</svg>
