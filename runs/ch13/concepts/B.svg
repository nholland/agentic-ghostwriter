<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" style="color:#1a1a1a" role="img" aria-label="Keep learning what matters to her">
<style>.ttl{font:600 25px Georgia,serif;text-anchor:middle}.sub{font:italic 19px Georgia,serif;text-anchor:middle;opacity:.78}.lbl{font:600 21px Georgia,serif;text-anchor:middle}.txt{font:21px Georgia,serif;text-anchor:middle}.cap{font:italic 20px Georgia,serif;text-anchor:middle}.ln{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.faint{opacity:.35}</style>
<rect width="640" height="560" fill="#fff"/>
<text class="ttl" fill="currentColor" x="320" y="43">Keep learning what matters to her</text>
<text class="sub" fill="currentColor" x="320" y="80">Its water keeps changing, and so do we.</text>
<g class="ln" opacity=".48"><path fill="none" d="M75 183C169 143 255 224 353 183S504 157 565 178M75 211C169 171 255 252 353 211S504 185 565 206M75 330C169 290 255 371 353 330S504 304 565 325M75 358C169 318 255 399 353 358S504 332 565 353"/></g><text class="sub" fill="currentColor" x="169" y="138">when you were dating</text>
<text class="lbl" fill="currentColor" x="473" y="138">now</text>
<path class="ln faint" fill="none" stroke-dasharray="4 6" d="M165 220V310"/><path class="ln" fill="none" d="M473 220V310M467 228L473 220L479 228M467 302L473 310L479 302"/><text class="sub" fill="currentColor" x="168" y="264">the answers</text>
<text class="sub" fill="currentColor" x="168" y="290">you already had</text>
<text class="lbl" fill="currentColor" x="473" y="261">Be interested</text>
<text class="lbl" fill="currentColor" x="473" y="287">in her answer.</text>
<text class="txt" fill="currentColor" x="320" y="427">She&#x27;s still becoming. You&#x27;ve changed too.</text>
<text class="cap" fill="currentColor" x="320" y="480">you asked the woman</text>
<text class="cap" fill="currentColor" x="320" y="508">who&#x27;s here now.</text>

</svg>
