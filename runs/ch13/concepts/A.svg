<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" style="color:#1a1a1a" role="img" aria-label="Keep learning her after you've won her">
<style>
.ttl{font:600 24px Georgia,serif;text-anchor:middle}
.lbl{font:600 17px Georgia,serif;text-anchor:middle}
.txt{font:19px Georgia,serif;text-anchor:middle}
.cap{font:italic 21px Georgia,serif;text-anchor:middle}
.ln{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rule{fill:none;stroke:currentColor;stroke-width:.8;opacity:.28}
</style>
<rect width="640" height="480" fill="#fff"/>
<text class="ttl" fill="currentColor" x="320" y="43">Keep learning her after you've won her</text>
<!-- carrier: a loop with no finish line; learning her comes back round -->
<path class="ln" d="M339.1 132.0A92 92 0 0 1 407.5 250.4M416.0 241.9L407.5 250.4M405.6 238.6L407.5 250.4M388.4 283.6A92 92 0 0 1 251.6 283.6M254.7 295.2L251.6 283.6M262.8 287.9L251.6 283.6M232.5 250.4A92 92 0 0 1 300.9 132.0M289.3 128.9L300.9 132.0M291.6 139.6L300.9 132.0"/>
<circle cx="320" cy="130" r="6" fill="currentColor"/>
<circle cx="399.7" cy="268" r="6" fill="currentColor"/>
<circle cx="240.3" cy="268" r="6" fill="currentColor"/>
<text class="lbl" fill="currentColor" x="320" y="108">Ask about her.</text>
<text class="lbl" fill="currentColor" x="464" y="312">remember the answer</text>
<text class="lbl" fill="currentColor" x="176" y="312">ask about it again</text>
<text class="cap" fill="currentColor" x="320" y="228">who she is now</text>
<path class="rule" d="M64 361H576"/>
<text class="cap" fill="currentColor" x="320" y="405">You were her suitor before she said yes,</text>
<text class="cap" fill="currentColor" x="320" y="437">and that job stayed open.</text>
</svg>
