<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" style="color:#1a1a1a" role="img" aria-label="The Private Tally">
  <style>
    .ttl{font:600 17px Georgia,serif;letter-spacing:.20em;text-anchor:middle}
    .sub{font:italic 13.5px Georgia,serif;text-anchor:middle;opacity:.74}
    .lbl{font:600 14px Georgia,serif;letter-spacing:.16em;text-anchor:start}
    .lblc{font:600 14px Georgia,serif;letter-spacing:.16em;text-anchor:middle}
    .txt{font:13px Georgia,serif;opacity:.86;text-anchor:start}
    .cap{font:italic 12px Georgia,serif;opacity:.66;text-anchor:middle}
    .capl{font:italic 12px Georgia,serif;opacity:.66;text-anchor:start}
    .rule{stroke:currentColor;stroke-width:.8;opacity:.28}
  </style>

  <rect x="0" y="0" width="640" height="420" fill="#ffffff"/>

  <g fill="currentColor">
    <text class="ttl" x="320" y="40">THE PRIVATE TALLY</text>
    <text class="sub" x="320" y="66">The ledger can only count what it can see.</text>
  </g>

  <g fill="currentColor">
    <text class="lblc" x="180" y="104">WHAT YOU COUNTED</text>
    <text class="lblc" x="460" y="104">WHAT SHE COUNTED</text>
  </g>

  <!-- your column: ruled, and you can read every line of it -->
  <g fill="none" stroke="currentColor" stroke-width="1" opacity=".38">
    <rect x="60" y="118" width="240" height="114"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.2" opacity=".8">
    <path d="M76 158h208"/>
    <path d="M76 190h208"/>
    <path d="M76 222h208"/>
  </g>
  <g fill="currentColor">
    <text class="txt" x="76" y="152">The router, that Tuesday</text>
    <text class="txt" x="76" y="184">The coaching weekend</text>
    <text class="txt" x="76" y="216">The day off work</text>
  </g>

  <!-- her column: ruled the same, and every line of it is out of your sight -->
  <g fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 5" opacity=".42">
    <rect x="340" y="118" width="240" height="114"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 5" opacity=".45">
    <path d="M356 158h208"/>
    <path d="M356 190h208"/>
    <path d="M356 222h208"/>
  </g>

