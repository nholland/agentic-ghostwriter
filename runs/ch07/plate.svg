    .sub{font:italic 13.5px Georgia,serif;text-anchor:middle;opacity:.74}
    .lbl{font:600 14px Georgia,serif;letter-spacing:.16em;text-anchor:start}
    .txt{font:13.5px Georgia,serif;text-anchor:start}
    .cap{font:italic 12px Georgia,serif;opacity:.66;text-anchor:middle}
    .capl{font:italic 12px Georgia,serif;opacity:.48;text-anchor:start}
    .rule{stroke:currentColor;stroke-width:.8;opacity:.28}
  </style>

  <rect x="0" y="0" width="640" height="424" fill="#ffffff"/>

  <g fill="currentColor">
    <text class="ttl" x="320" y="40">THE PRIVATE TALLY</text>
    <text class="sub" x="320" y="66">The ledger can only count what it can see.</text>
  </g>

  <g fill="currentColor">
    <text class="lbl" x="60" y="104">YOUR PAGE</text>
    <text class="lbl" x="340" y="104">HER PAGE</text>
  </g>

  <!-- your page: solid, ruled, and every line of it is legible -->
  <g fill="none" stroke="currentColor" stroke-width="1.3" opacity=".62">
    <rect x="60" y="118" width="240" height="114"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".9">
    <path d="M76 158h208"/>
    <path d="M76 190h208"/>
    <path d="M76 222h208"/>
  </g>
  <g fill="currentColor">
    <text class="txt" x="76" y="152">Fixing the router</text>
    <text class="txt" x="76" y="184">The coaching weekend</text>
    <text class="txt" x="76" y="216">Cleaning the kitchen</text>
  </g>

  <!-- her page: the same size, and nothing on it is available to you -->
  <g fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 6" opacity=".24">
    <rect x="340" y="118" width="240" height="114"/>
  </g>
  <g fill="currentColor">
    <text class="capl" x="356" y="181">a ledger you can’t fully read</text>
  </g>

