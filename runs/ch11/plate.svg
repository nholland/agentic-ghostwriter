<!-- Chapter 11 plate: approved prose copy refresh, 2026-09-24. Geometry preserved.
     2026-11-07: type re-set for phone width (author ruling "1. Enlarge"). The
     two boxes are rebalanced (her box wider) so the line inside it can be set
     large on one line; words and drawing unchanged. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" style="color:#1a1a1a" role="img" aria-label="The Conversation She’s Never Heard">
  <style>
    .ttl{font:600 20px Georgia,serif;letter-spacing:.12em;text-anchor:middle}
    .sub{font:italic 18px Georgia,serif;text-anchor:middle;opacity:.74}
    .lbl{font:600 17px Georgia,serif;letter-spacing:.12em;text-anchor:start}
    .cap{font:italic 18px Georgia,serif;opacity:.66;text-anchor:middle}
    .capl{font:italic 18px Georgia,serif;opacity:.5;text-anchor:start}
    .max{font:italic 22px Georgia,serif;opacity:.8;text-anchor:middle}
    .rule{stroke:currentColor;stroke-width:.8;opacity:.28}
  </style>

  <rect x="0" y="0" width="640" height="410" fill="#ffffff"/>

  <g fill="currentColor">
    <text class="ttl" x="320" y="44">THE CONVERSATION SHE’S NEVER HEARD</text>
    <text class="sub" x="320" y="78">You keep arguing with her in your head.</text>
  </g>

  <g fill="currentColor">
    <text class="lbl" x="48" y="124">IN YOUR HEAD</text>
    <text class="lbl" x="330" y="124">WITH HER</text>
  </g>

  <!-- the rehearsals, stacked -->
  <g fill="none" stroke="currentColor" stroke-width="1" opacity=".35">
    <rect x="48" y="136" width="240" height="134"/>
  </g>
  <g fill="currentColor" opacity=".86">
    <rect x="72" y="152" width="192" height="8"/>
    <rect x="72" y="168" width="192" height="8"/>
    <rect x="72" y="184" width="192" height="8"/>
    <rect x="72" y="200" width="192" height="8"/>
    <rect x="72" y="216" width="192" height="8"/>
    <rect x="72" y="232" width="192" height="8"/>
    <rect x="72" y="248" width="192" height="8"/>
  </g>

  <!-- it sets out and never arrives -->
  <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 5" opacity=".4">
    <rect x="330" y="136" width="262" height="134"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 4" opacity=".45" stroke-linecap="round">
    <path d="M294 203h18"/>
  </g>
  <g fill="currentColor" opacity=".45"><path d="M322 203l-10-4v8z"/></g>

  <g fill="currentColor">
    <text class="capl" x="350" y="209">you haven’t told her</text>
  </g>

  <g class="rule" fill="none"><path d="M44 310h552"/></g>

  <g fill="currentColor">
    <text class="cap" x="320" y="344">Tell her what’s bothering you.</text>
    <text class="max" x="320" y="382">Then listen.</text>
  </g>
</svg>
