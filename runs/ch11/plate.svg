<!-- Chapter 11 plate: approved prose copy refresh, 2026-09-24. Geometry preserved. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 376" style="color:#1a1a1a" role="img" aria-label="The Conversation She’s Never Heard">
  <style>
    .ttl{font:600 17px Georgia,serif;letter-spacing:.20em;text-anchor:middle}
    .sub{font:italic 13.5px Georgia,serif;text-anchor:middle;opacity:.74}
    .lbl{font:600 14px Georgia,serif;letter-spacing:.16em;text-anchor:start}
    .cap{font:italic 12px Georgia,serif;opacity:.66;text-anchor:middle}
    .capl{font:italic 12px Georgia,serif;opacity:.5;text-anchor:start}
    .max{font:italic 15px Georgia,serif;opacity:.8;text-anchor:middle}
    .rule{stroke:currentColor;stroke-width:.8;opacity:.28}
  </style>

  <rect x="0" y="0" width="640" height="376" fill="#ffffff"/>

  <g fill="currentColor">
    <text class="ttl" x="320" y="40">THE CONVERSATION SHE’S NEVER HEARD</text>
    <text class="sub" x="320" y="66">You keep arguing with her in your head.</text>
  </g>

  <g fill="currentColor">
    <text class="lbl" x="60" y="98">IN YOUR HEAD</text>
    <text class="lbl" x="366" y="98">WITH HER</text>
  </g>

  <!-- the rehearsals, stacked -->
  <g fill="none" stroke="currentColor" stroke-width="1" opacity=".35">
    <rect x="60" y="110" width="240" height="134"/>
  </g>
  <g fill="currentColor" opacity=".86">
    <rect x="84" y="126" width="192" height="8"/>
    <rect x="84" y="142" width="192" height="8"/>
    <rect x="84" y="158" width="192" height="8"/>
    <rect x="84" y="174" width="192" height="8"/>
    <rect x="84" y="190" width="192" height="8"/>
    <rect x="84" y="206" width="192" height="8"/>
    <rect x="84" y="222" width="192" height="8"/>
  </g>

  <!-- it sets out and never arrives -->
  <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 5" opacity=".4">
    <rect x="366" y="110" width="214" height="134"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 4" opacity=".45" stroke-linecap="round">
    <path d="M308 177h18"/>
  </g>
  <g fill="currentColor" opacity=".45"><path d="M334 177l-10-4v8z"/></g>

  <g fill="currentColor">
    <text class="capl" x="382" y="182">you haven’t told her</text>
  </g>

  <g class="rule" fill="none"><path d="M44 288h552"/></g>

  <g fill="currentColor">
    <text class="cap" x="320" y="314">Tell her what’s bothering you.</text>
    <text class="max" x="320" y="344">Then listen.</text>
  </g>
</svg>
