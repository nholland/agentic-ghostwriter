<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" style="color:#1a1a1a" role="img" aria-label="The Thing With No Deadline, concept C">
  <style>
    .ttl{font:600 17px Georgia,serif;letter-spacing:.20em;text-anchor:middle}
    .sub{font:italic 13.5px Georgia,serif;text-anchor:middle;opacity:.74}
    .lbl{font:600 13px Georgia,serif;letter-spacing:.16em;text-anchor:start}
    .cap{font:italic 12px Georgia,serif;opacity:.66;text-anchor:middle}
    .capl{font:italic 12px Georgia,serif;opacity:.66;text-anchor:start}
    .capr{font:italic 12px Georgia,serif;opacity:.66;text-anchor:end}
    .rule{stroke:currentColor;stroke-width:.8;opacity:.28}
  </style>

  <rect x="0" y="0" width="640" height="430" fill="#ffffff"/>

  <g fill="currentColor">
    <text class="ttl" x="320" y="40">THE THING WITH NO DEADLINE</text>
    <text class="sub" x="320" y="66">Nothing in a week tells you how long it has been.</text>
  </g>

  <!-- both rows begin in the same week -->
  <g class="rule" fill="none"><path d="M108 140v176"/></g>

  <!-- the things that shout: unbroken, week after week -->
  <g fill="none" stroke="currentColor" stroke-width="1" opacity=".45">
    <path d="M110 182h460"/>
  </g>
  <g fill="currentColor" opacity=".85">
    <rect x="110" y="174" width="9" height="9"/>
    <rect x="156" y="174" width="9" height="9"/>
    <rect x="202" y="174" width="9" height="9"/>
    <rect x="248" y="174" width="9" height="9"/>
    <rect x="294" y="174" width="9" height="9"/>
    <rect x="340" y="174" width="9" height="9"/>
    <rect x="386" y="174" width="9" height="9"/>
    <rect x="432" y="174" width="9" height="9"/>
    <rect x="478" y="174" width="9" height="9"/>
    <rect x="524" y="174" width="9" height="9"/>
  </g>
  <g fill="currentColor">
    <text class="lbl" x="110" y="156">THE THINGS THAT SHOUT</text>
    <text class="capl" x="110" y="206">a day attached, and somebody waiting</text>
  </g>

  <!-- the one for her: stops, and nothing marks the stopping -->
  <g fill="none" stroke="currentColor" stroke-width="1" opacity=".45">
    <path d="M110 292h460"/>
  </g>
  <g fill="currentColor" opacity=".85">
    <rect x="110" y="284" width="9" height="9"/>
    <rect x="156" y="284" width="9" height="9"/>
    <rect x="202" y="284" width="9" height="9"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.4" opacity=".85">
    <rect x="556" y="284" width="9" height="9" fill="none"/>
  </g>
  <g fill="currentColor">
    <text class="lbl" x="110" y="266">THE ONE THING FOR HER</text>
    <text class="capl" x="110" y="316">no day, and nobody waiting</text>
    <text class="capr" x="570" y="342">tonight, in the shape she reads as care</text>
  </g>
  <g fill="currentColor">
    <text class="cap" x="384" y="278">the stretch you never felt go by</text>
  </g>

  <g class="rule" fill="none"><path d="M44 388h552"/></g>

  <g fill="currentColor">
    <text class="cap" x="320" y="412">It is a thing you stopped doing. Starting again asks nobody’s forgiveness.</text>
  </g>
</svg>
