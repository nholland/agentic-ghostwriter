<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" style="color:#1a1a1a" role="img" aria-label="The Thing With No Deadline">
  <style>
    .ttl{font:600 17px Georgia,serif;letter-spacing:.20em;text-anchor:middle}
    .sub{font:italic 13.5px Georgia,serif;text-anchor:middle;opacity:.74}
    .lbl{font:600 14px Georgia,serif;letter-spacing:.16em;text-anchor:start}
    .txt{font:13px Georgia,serif;opacity:.86;text-anchor:start}
    .cap{font:italic 12px Georgia,serif;opacity:.66;text-anchor:middle}
    .capl{font:italic 12px Georgia,serif;opacity:.66;text-anchor:start}
    .rule{stroke:currentColor;stroke-width:.8;opacity:.28}
  </style>

  <rect x="0" y="0" width="640" height="390" fill="#ffffff"/>

  <g fill="currentColor">
    <text class="ttl" x="320" y="40">THE THING WITH NO DEADLINE</text>
    <text class="sub" x="320" y="66">Nobody calls you at work about this one.</text>
  </g>

  <g fill="currentColor">
    <text class="lbl" x="60" y="108">THE WEEK’S NECESSARY THINGS</text>
  </g>

  <!-- the things with a day attached, each one marked -->
  <g fill="currentColor" opacity=".82">
    <rect x="60" y="136" width="10" height="10"/>
    <rect x="60" y="170" width="10" height="10"/>
    <rect x="60" y="204" width="10" height="10"/>
    <rect x="60" y="238" width="10" height="10"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.2" opacity=".8">
    <path d="M60 154h280"/>
    <path d="M60 188h280"/>
    <path d="M60 222h280"/>
    <path d="M60 256h280"/>
  </g>
  <g fill="currentColor">
    <text class="txt" x="84" y="148">The mortgage</text>
    <text class="txt" x="84" y="182">The kid’s game, eight on a Saturday</text>
    <text class="txt" x="84" y="216">Work</text>
    <text class="txt" x="84" y="250">Everything else that shouts</text>
  </g>

  <!-- the line nothing was written on, and no mark beside it -->
  <g fill="none" stroke="currentColor" stroke-width="1.2" opacity=".8">
    <path d="M60 296h280"/>
  </g>
  <g fill="currentColor">
    <text class="capl" x="84" y="316">her</text>
  </g>

  <!-- one shape stops short of the line; one reaches it -->
  <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 5" opacity=".5">
    <path d="M390 276 354 290"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <path d="M390 318 340 297"/>
  </g>
  <g fill="currentColor">
    <text class="capl" x="398" y="272">said in your language</text>
    <text class="capl" x="398" y="324">heard in hers</text>
  </g>

  <g class="rule" fill="none"><path d="M44 344h552"/></g>

  <g fill="currentColor">
    <text class="cap" x="320" y="370">Everything on this list had a day attached. One thing did not.</text>
  </g>
</svg>
