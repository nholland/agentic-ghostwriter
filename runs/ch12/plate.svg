<!-- Chapter 12 plate, round 4 (outside-reader round, 2026-09-21).
     Same objects as round 3: two timelines running to the same right-hand
     endpoint, dark squares along them, one hollow open square at the end.
     Re-weighted so the argument is what the eye lands on first: the row that
     gets marked every week is dropped back to a murmur, the stretch with
     nothing in it is the loudest thing on the plate, and the open square at
     the end is drawn large and heavy, because it is the one thing here that
     is still available. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" style="color:#1a1a1a" role="img" aria-label="The Thing With No Deadline">
  <style>
    .ttl{font:600 17px Georgia,serif;letter-spacing:.20em;text-anchor:middle}
    .sub{font:italic 13.5px Georgia,serif;text-anchor:middle;opacity:.74}
    .lbl{font:600 13px Georgia,serif;letter-spacing:.16em;text-anchor:start}
    .lbld{font:600 13px Georgia,serif;letter-spacing:.16em;text-anchor:start;opacity:.45}
    .lblc{font:600 12.5px Georgia,serif;letter-spacing:.16em;text-anchor:middle}
    .cap{font:italic 12px Georgia,serif;opacity:.66;text-anchor:middle}
    .rule{stroke:currentColor;stroke-width:.8;opacity:.28}
    .span{stroke:currentColor;stroke-width:1.2;fill:none;opacity:.5}
  </style>

  <rect x="0" y="0" width="640" height="430" fill="#ffffff"/>

  <g fill="currentColor">
    <text class="ttl" x="320" y="40">THE THING WITH NO DEADLINE</text>
    <text class="sub" x="320" y="66">What has no deadline is easiest to neglect.</text>
  </g>

  <!-- the week both rows start in, and the week we are standing in -->
  <g class="rule" fill="none"><path d="M102 140v124"/></g>
  <g class="rule" fill="none"><path d="M520 114v122"/></g>

  <!-- the things with a day attached: marked every week, all the way to now,
       and deliberately quiet, because they are not the argument -->
  <g fill="none" stroke="currentColor" stroke-width=".8" opacity=".22"><path d="M110 160h424"/></g>
  <g fill="currentColor" opacity=".34">
    <rect x="119" y="150" width="10" height="10"/>
    <rect x="152" y="150" width="10" height="10"/>
    <rect x="185" y="150" width="10" height="10"/>
    <rect x="218" y="150" width="10" height="10"/>
    <rect x="251" y="150" width="10" height="10"/>
    <rect x="284" y="150" width="10" height="10"/>
    <rect x="317" y="150" width="10" height="10"/>
    <rect x="350" y="150" width="10" height="10"/>
    <rect x="383" y="150" width="10" height="10"/>
    <rect x="416" y="150" width="10" height="10"/>
    <rect x="449" y="150" width="10" height="10"/>
    <rect x="482" y="150" width="10" height="10"/>
    <rect x="515" y="150" width="10" height="10"/>
  </g>

  <!-- the one for her: a few weeks, then a stretch with nothing in it at all,
       and at the end of it one square still open -->
  <g fill="none" stroke="currentColor" stroke-width="1.1" opacity=".55"><path d="M110 258h424"/></g>
  <g fill="currentColor" opacity=".9">
    <rect x="119" y="248" width="10" height="10"/>
    <rect x="152" y="248" width="10" height="10"/>
    <rect x="185" y="248" width="10" height="10"/>
  </g>
  <g fill="#ffffff" stroke="currentColor" stroke-width="2.6">
    <rect x="511" y="240" width="18" height="18"/>
  </g>

  <!-- the span nothing in the week ever marked -->
  <g class="span"><path d="M197 288v8h308v-8"/></g>

  <g fill="currentColor">
    <text class="lbld" x="110" y="134">THE THINGS WITH A DAY ATTACHED</text>
    <text class="lbl" x="110" y="232">THE ONE THING FOR HER</text>
    <text class="lblc" x="520" y="104">THIS WEEK</text>
    <text class="lblc" x="520" y="282">TONIGHT</text>
    <text class="cap" x="347" y="322">the stretch you never felt go by</text>
    <text class="cap" x="347" y="344">you didn’t stop loving her</text>
  </g>

  <g class="rule" fill="none"><path d="M44 386h552"/></g>

  <g fill="currentColor">
    <text class="cap" x="320" y="412">Love rarely becomes urgent. That is why you have to make room for it.</text>
  </g>
</svg>
