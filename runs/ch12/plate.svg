<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" style="color:#1a1a1a" role="img" aria-label="The Muscle You Stopped Using">
  <style>
    .ttl{font:600 17px Georgia,serif;letter-spacing:.20em;text-anchor:middle}
    .sub{font:italic 13.5px Georgia,serif;text-anchor:middle;opacity:.74}
    .lbl{font:600 14px Georgia,serif;letter-spacing:.16em}
    .txt{font:14px Georgia,serif;opacity:.86}
    .cap{font:italic 12px Georgia,serif;opacity:.66;text-anchor:middle}
    .src{font:11.5px Georgia,serif;opacity:.55;text-anchor:middle}
    .rule{stroke:currentColor;stroke-width:.8;opacity:.28}
  </style>

  <rect x="0" y="0" width="640" height="460" fill="#ffffff"/>

  <g fill="currentColor">
    <text class="ttl" x="320" y="40">THE MUSCLE YOU STOPPED USING</text>
    <text class="sub" x="320" y="66">Nobody took it away. It shrank while you were busy.</text>
  </g>

  <!-- the three Epictetus names, each kept at full size by the doing -->
  <g fill="currentColor" opacity=".82">
    <rect x="196" y="112" width="364" height="20"/>
    <rect x="196" y="150" width="364" height="20"/>
    <rect x="196" y="188" width="364" height="20"/>
  </g>
  <g fill="currentColor">
    <text class="lbl" x="44" y="127">WALKING</text>
    <text class="lbl" x="44" y="165">RUNNING</text>
    <text class="lbl" x="44" y="203">READING</text>
    <text class="cap" x="320" y="234">Each one is kept by doing it. Nothing else keeps it.</text>
  </g>

  <g class="rule" fill="none"><path d="M44 262h552"/></g>

  <!-- the same rule, in the corner nobody aimed at -->
  <g fill="currentColor">
    <text class="cap" x="320" y="288">The same rule, in the one corner you never aimed at.</text>
  </g>

  <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 5" opacity=".45">
    <rect x="196" y="308" width="364" height="20"/>
  </g>
  <g fill="currentColor" opacity=".82">
    <rect x="196" y="308" width="74" height="20"/>
  </g>
  <g fill="currentColor" opacity=".38">
    <rect x="276" y="308" width="20" height="20"/>
  </g>

  <g fill="currentColor">
    <text class="lbl" x="44" y="323">ROMANCE</text>
    <text class="cap" x="44" y="340" style="text-anchor:start;font-size:10.5px">no deadline, nobody watching</text>
    <text class="cap" x="286" y="366">tonight</text>
    <text class="cap" x="430" y="366">where it used to reach</text>
  </g>

  <g fill="currentColor">
    <text class="cap" x="320" y="394">Nothing here is gone. It is only out of use.</text>
    <text class="cap" x="320" y="414">It comes back the way it was built, by doing it.</text>
    <text class="src" x="320" y="440">After Epictetus, Discourses 2.18</text>
  </g>
</svg>
