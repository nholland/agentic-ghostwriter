<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" style="color:#1a1a1a" role="img" aria-label="Appreciation becomes care"><style>.ttl{font:600 17px Georgia,serif;letter-spacing:.20em;text-anchor:middle}.lbl{font:600 18px Georgia,serif;text-anchor:middle}.txt{font:18px Georgia,serif;text-anchor:middle}.cap{font:italic 16px Georgia,serif;text-anchor:middle;opacity:.74}</style><rect x="0" y="0" width="640" height="500" fill="#ffffff"/><text class="ttl" x="320" y="40" fill="currentColor">Appreciation becomes care</text><text class="txt" x="320" y="86" fill="currentColor">Notice what you value in your wife</text><text class="lbl" x="320" y="138" fill="currentColor">the care you give her</text><text class="cap" x="160" y="187" fill="currentColor">a kinder answer</text><text class="cap" x="440" y="187" fill="currentColor">a sincere compliment</text><path d="M320 318 Q260 229 160 214 M320 318 Q378 229 440 214 M320 318 Q316 250 321 212" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M160 214 Q193 261 247 265 M440 214 Q405 267 379 267" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M90 318H550" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M320 318V370 M320 349Q240 369 200 400 M320 357Q398 366 440 400 M320 370L288 402 M320 370L353 402" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text class="lbl" x="320" y="435" fill="currentColor">appreciation</text><text class="cap" x="320" y="475" fill="currentColor">the life you share</text></svg>
