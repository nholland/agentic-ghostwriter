<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" style="color:#1a1a1a" role="img" aria-label="Appreciation becomes care">
<style>
.ttl{font:600 17px Georgia,serif;letter-spacing:.20em;text-anchor:middle}
.lbl{font:600 16px Georgia,serif;text-anchor:middle}
.txt{font:16px Georgia,serif;text-anchor:middle}
.cap{font:italic 14px Georgia,serif;text-anchor:middle;opacity:.74}
</style>
<rect x="0" y="0" width="640" height="460" fill="#ffffff"/>
<text class="ttl" x="320" y="40" fill="currentColor">Appreciation becomes care</text>
<text class="lbl" x="320" y="95" fill="currentColor">Notice what you value</text>
<text class="txt" x="320" y="118" fill="currentColor">in your wife</text>
<path d="M391 130Q512 150 522 227 M514 215L522 227L528 213 M488 296Q457 366 362 376 M377 369L362 376L378 382 M246 374Q151 357 129 286 M124 301L129 286L139 298 M120 222Q130 150 249 130 M234 126L249 130L237 140" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text class="txt" x="510" y="263" fill="currentColor">tell her</text>
<text class="txt" x="130" y="263" fill="currentColor">enjoy it</text>
<path d="M236 264H404" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
<path d="M256 264Q254 247 246 238M256 264Q257 235 263 228M256 264Q265 248 271 246" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M284 264Q282 247 274 238M284 264Q285 235 291 228M284 264Q293 248 299 246" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M312 264Q310 247 302 238M312 264Q313 235 319 228M312 264Q321 248 327 246" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M340 264Q338 247 330 238M340 264Q341 235 347 228M340 264Q349 248 355 246" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M368 264Q366 247 358 238M368 264Q369 235 375 228M368 264Q377 248 383 246" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text class="txt" x="320" y="294" fill="currentColor">the life</text>
<text class="txt" x="320" y="315" fill="currentColor">you share</text>
<text class="lbl" x="320" y="410" fill="currentColor">a kinder answer</text>
<text class="cap" x="320" y="439" fill="currentColor">on ordinary days</text>
</svg>
