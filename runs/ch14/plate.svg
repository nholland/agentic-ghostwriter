<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" style="color:#1a1a1a" role="img" aria-label="Appreciation becomes care">
<style>
.ttl{font:600 17px Georgia,serif;letter-spacing:.20em;text-anchor:middle}
.lbl{font:600 16px Georgia,serif;text-anchor:middle}
.txt{font:16px Georgia,serif;text-anchor:middle}
.cap{font:italic 14px Georgia,serif;text-anchor:middle;opacity:.74}
</style>
<rect x="0" y="0" width="640" height="500" fill="#ffffff"/>
<text class="ttl" x="320" y="40" fill="currentColor">Appreciation becomes care</text>
<text class="txt" x="320" y="79" fill="currentColor">Notice what you value</text>
<text class="txt" x="320" y="101" fill="currentColor">in your wife</text>
<text class="lbl" x="320" y="137" fill="currentColor">appreciation</text>
<!-- A single act of giving care, not a model of all contributions to marriage. -->
<g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M280 155H350V207H280Z" fill="none"/>
<path d="M280 166C232 137 232 217 280 195" fill="none"/>
<path d="M350 182L385 157L396 164L350 203" fill="none"/>
</g>
<g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".65">
<path d="M390 177Q469 206 480 264" fill="none"/>
<path d="M383 181Q385 229 320 264" fill="none"/>
<path d="M376 185Q279 239 160 264" fill="none"/>
</g>
<text class="lbl" x="320" y="297" fill="currentColor">the care you give her</text>
<text class="txt" x="160" y="330" fill="currentColor">a kinder</text>
<text class="txt" x="160" y="352" fill="currentColor">answer</text>
<text class="txt" x="320" y="330" fill="currentColor">a sincere</text>
<text class="txt" x="320" y="352" fill="currentColor">compliment</text>
<text class="txt" x="480" y="330" fill="currentColor">enjoying</text>
<text class="txt" x="480" y="352" fill="currentColor">her company</text>
<text class="cap" x="320" y="380" fill="currentColor">without requiring a particular response</text>
<!-- The ground continues beyond this small act. No before/after growth claim. -->
<g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
<path d="M44 442H596" fill="none" opacity=".35"/>
<path d="M64 442Q62 425 54 416M64 442Q64 417 69 409M64 442Q71 427 74 426" fill="none"/>
<path d="M96 442Q94 425 86 416M96 442Q96 417 101 409M96 442Q103 427 106 426" fill="none"/>
