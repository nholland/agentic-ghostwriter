<path d="M470 382q-2 -30 -13 -43 M470 382q0 -37 6 -52 M470 382q5 -23 15 -30" fill="none"/>
<path d="M496 382q-2 -30 -13 -43 M496 382q0 -37 6 -52 M496 382q5 -23 15 -30" fill="none"/>
