<path d="M192 442Q190 425 182 416M192 442Q192 417 197 409M192 442Q199 427 202 426" fill="none"/>
<path d="M224 442Q222 425 214 416M224 442Q224 417 229 409M224 442Q231 427 234 426" fill="none"/>
<path d="M256 442Q254 425 246 416M256 442Q256 417 261 409M256 442Q263 427 266 426" fill="none"/>
<path d="M288 442Q286 425 278 416M288 442Q288 417 293 409M288 442Q295 427 298 426" fill="none"/>
<path d="M320 442Q318 425 310 416M320 442Q320 417 325 409M320 442Q327 427 330 426" fill="none"/>
<path d="M352 442Q350 425 342 416M352 442Q352 417 357 409M352 442Q359 427 362 426" fill="none"/>
<path d="M384 442Q382 425 374 416M384 442Q384 417 389 409M384 442Q391 427 394 426" fill="none"/>
<path d="M416 442Q414 425 406 416M416 442Q416 417 421 409M416 442Q423 427 426 426" fill="none"/>
<path d="M448 442Q446 425 438 416M448 442Q448 417 453 409M448 442Q455 427 458 426" fill="none"/>
<path d="M480 442Q478 425 470 416M480 442Q480 417 485 409M480 442Q487 427 490 426" fill="none"/>
<path d="M512 442Q510 425 502 416M512 442Q512 417 517 409M512 442Q519 427 522 426" fill="none"/>
<path d="M544 442Q542 425 534 416M544 442Q544 417 549 409M544 442Q551 427 554 426" fill="none"/>
<path d="M576 442Q574 425 566 416M576 442Q576 417 581 409M576 442Q583 427 586 426" fill="none"/>
</g>
<text class="cap" x="320" y="473" fill="currentColor">the life you share</text>
</svg>
