<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" style="color:#1a1a1a" role="img" aria-label="Appreciation becomes care">
<style>
.ttl{font:600 17px Georgia,serif;letter-spacing:.20em;text-anchor:middle}
.txt{font:18px Georgia,serif;text-anchor:middle}
.lbl{font:600 18px Georgia,serif;text-anchor:start}
.cap{font:italic 16px Georgia,serif;text-anchor:middle;opacity:.8}
.inside{font:italic 16px Georgia,serif;text-anchor:start;opacity:.8}
</style>
<rect x="0" y="0" width="640" height="500" fill="#ffffff"/>
<text class="ttl" x="320" y="40" fill="currentColor">Appreciation becomes care</text>
<text class="txt" x="320" y="86" fill="currentColor">Notice what you value in your wife</text>
