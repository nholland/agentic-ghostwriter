<!-- Ch16 concept A, rough thumbnail: the capstone. Two posts, CALM and STRENGTH, stand apart under an empty dashed slot; the same two posts with WARMTH set on top become one gateway. Blocks mirrored at 180/460 about 320. Weights: 1.4 quiet, 2 standard, 3.2 carrier. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" style="color:#1a1a1a" role="img" aria-label="Calm, strength and warmth together put the marriage in flow">
  <style>
    .ttl{font:600 14px Georgia,serif;text-anchor:middle}
    .sub{font:italic 14px Georgia,serif;text-anchor:middle;opacity:.74}
    .lbl{font:600 13px Georgia,serif;letter-spacing:.12em;text-anchor:middle}
    .lblw{font:600 14px Georgia,serif;letter-spacing:.14em;text-anchor:middle}
    .cap{font:italic 13px Georgia,serif;text-anchor:middle;opacity:.74}
    .capq{font:italic 600 14px Georgia,serif;text-anchor:middle}
  </style>
  <rect x="0" y="0" width="640" height="470" fill="#ffffff"/>
  <g fill="currentColor">
    <text class="ttl" x="320" y="40">Calm, strength and warmth together put the marriage in flow</text>
    <text class="sub" x="320" y="64">Warmth is what the calm and the strength were for</text>
  </g>
  <!-- left: posts alone, empty slot above -->
  <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 5" opacity=".45"><rect x="104" y="140" width="152" height="28"/></g>
  <g fill="#ffffff" stroke="currentColor" stroke-width="2"><rect x="120" y="172" width="28" height="160"/><rect x="212" y="172" width="28" height="160"/></g>
  <!-- right: same posts, capstone set on top -->
  <g fill="#ffffff" stroke="currentColor" stroke-width="2"><rect x="400" y="172" width="28" height="160"/><rect x="492" y="172" width="28" height="160"/></g>
  <g fill="currentColor" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"><rect x="384" y="140" width="152" height="28"/></g>
  <text class="lblw" x="460" y="159" fill="#ffffff">WARMTH</text>
  <text class="cap" x="460" y="124" fill="currentColor">without being asked</text>
  <!-- the move between them -->
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M290 252H350M350 252l-9 -6M350 252l-9 6"/></g>
  <g fill="currentColor">
    <text class="lbl" x="180" y="358">THE CALM AND THE STRENGTH</text>
    <text class="lbl" x="460" y="358">THE CALM AND THE STRENGTH</text>
    <text class="cap" x="180" y="388">calm can go cold</text>
    <text class="cap" x="460" y="388">one marriage</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.4" opacity=".28"><path d="M120 410H520"/></g>
  <text class="capq" x="320" y="440" fill="currentColor">At peace, at its best, and flourishing</text>
</svg>
