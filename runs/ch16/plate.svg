<!-- Ch16 plate, revision for "The Marriage in Flow": concept A, the capstone, redrawn as a house. Left: two walls, CALM and STRENGTH, standing on one floor line under an empty dashed roof; structurally sound. Right: the same walls with WARMTH laid on top as the roof; a home. Blocks mirrored at 180/460 about 320. Weights: 1.4 quiet, 2 standard, 3.2 carrier. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" style="color:#1a1a1a" role="img" aria-label="Calm and strength make the marriage sound; warmth makes it a home">
  <style>
    .ttl{font:600 13px Georgia,'Times New Roman',serif;text-anchor:middle}
    .sub{font:italic 14px Georgia,'Times New Roman',serif;text-anchor:middle;opacity:.74}
    .lbl{font:600 13px Georgia,'Times New Roman',serif;letter-spacing:.12em;text-anchor:middle}
    .lblw{font:600 14px Georgia,'Times New Roman',serif;letter-spacing:.14em;text-anchor:middle}
    .cap{font:italic 13px Georgia,'Times New Roman',serif;text-anchor:middle;opacity:.74}
    .capq{font:italic 600 14px Georgia,'Times New Roman',serif;text-anchor:middle}
  </style>
  <rect x="0" y="0" width="640" height="470" fill="#ffffff"/>
  <g fill="currentColor">
    <text class="ttl" x="320" y="40">Calm and strength make the marriage sound; warmth makes it a home</text>
    <text class="sub" x="320" y="84">Warmth is what the calm and the strength were for</text>
  </g>
  <!-- left: the walls alone, sound, the roof slot empty -->
  <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 5" stroke-linejoin="round" opacity=".45"><path d="M88 206L180 136L272 206Z"/></g>
  <g fill="#ffffff" stroke="currentColor" stroke-width="2">
    <rect x="120" y="206" width="28" height="130"/>
    <rect x="212" y="206" width="28" height="130"/>
    <rect x="400" y="206" width="28" height="130"/>
    <rect x="492" y="206" width="28" height="130"/>
  </g>
  <!-- right: the same walls, warmth laid on top as the roof -->
  <g fill="currentColor" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"><path d="M368 206L460 136L552 206Z"/></g>
  <text class="lblw" x="460" y="196" fill="#ffffff">WARMTH</text>
  <!-- doors and floor lines, identical on both sides -->
  <g fill="none" stroke="currentColor" stroke-width="1.4" opacity=".6"><path d="M168 336V296H192V336M448 336V296H472V336"/></g>
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M88 336H272M368 336H552"/></g>
  <!-- the move between them -->
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M290 271H350M350 271l-9 -6M350 271l-9 6"/></g>
  <g fill="currentColor">
    <text class="cap" x="180" y="122">calm alone can go cold</text>
    <text class="cap" x="460" y="122">small, warm things</text>
    <text class="lbl" x="134" y="360">CALM</text>
    <text class="lbl" x="226" y="360">STRENGTH</text>
    <text class="lbl" x="414" y="360">CALM</text>
    <text class="lbl" x="506" y="360">STRENGTH</text>
    <text class="cap" x="180" y="388">structurally sound</text>
    <text class="cap" x="460" y="388">a home</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.4" opacity=".28"><path d="M120 410H520"/></g>
  <text class="capq" x="320" y="440" fill="currentColor">At peace, at its best, and flourishing</text>
</svg>
