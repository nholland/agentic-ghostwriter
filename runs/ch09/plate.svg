<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" style="color:#1a1a1a" role="img" aria-label="The Bottomless Yes">
  <style>
    .ttl{font:600 17px Georgia,serif;letter-spacing:.20em;text-anchor:middle}
    .sub{font:italic 13.5px Georgia,serif;text-anchor:middle;opacity:.74}
    .lbl{font:600 14px Georgia,serif;letter-spacing:.16em}
    .txt{font:13px Georgia,serif;opacity:.86}
    .cap{font:italic 12px Georgia,serif;opacity:.66;text-anchor:middle}
    .src{font:11.5px Georgia,serif;opacity:.55;text-anchor:middle}
    .rule{stroke:currentColor;stroke-width:.8;opacity:.28}
    .ln{stroke:currentColor;stroke-width:1.4}
  </style>

  <rect x="0" y="0" width="640" height="440" fill="#ffffff"/>

  <g fill="currentColor">
    <text class="ttl" x="320" y="40">THE BOTTOMLESS YES</text>
    <text class="sub" x="320" y="66">You never named the deal, so she never agreed to it.</text>
  </g>

  <!-- what went out, and what was quietly expected back -->
  <g fill="currentColor">
    <text class="lbl" x="44" y="104">WHAT YOU GAVE</text>
    <text class="lbl" x="352" y="104">WHAT YOU EXPECTED</text>
  </g>

  <g fill="currentColor">
    <text class="txt" x="44" y="140">A night you did everything she wanted</text>
    <text class="txt" x="44" y="172">A plan you went along with, not yours</text>
    <text class="txt" x="44" y="204">Her story, heard all the way through</text>
    <text class="txt" x="352" y="140">Respect</text>
    <text class="txt" x="352" y="172">Warmth</text>
    <text class="txt" x="352" y="204">Being asked about</text>
  </g>

  <!-- the yes goes out -->
  <g class="ln" fill="none" stroke-linecap="round">
    <path d="M304 135h28"/><path d="M304 167h28"/><path d="M304 199h28"/>
  </g>
  <g fill="currentColor">
    <path d="M340 135l-10-4v8z"/>
    <path d="M340 167l-10-4v8z"/>
    <path d="M340 199l-10-4v8z"/>
  </g>

  <!-- the return trip, empty -->
  <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 5" opacity=".5">
    <path d="M576 248H68"/>
  </g>
  <g fill="currentColor" opacity=".5">
    <path d="M56 248l12-5v10z"/>
  </g>
  <g fill="currentColor">
    <text class="cap" x="320" y="276">Nothing comes back, and you never once asked for it.</text>
  </g>

  <g class="rule" fill="none"><path d="M44 300h552"/></g>

  <!-- where the shortfall goes -->
  <g fill="currentColor">
    <text class="cap" x="320" y="326">Every yes that does not come back becomes a line on a list.</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".8">
    <path d="M170 344h210"/>
    <path d="M170 358h210"/>
    <path d="M170 372h210"/>
    <path d="M170 386h210"/>
    <path d="M170 400h128"/>
  </g>
  <g fill="currentColor">
    <text class="cap" x="486" y="374">a list only you are keeping</text>
    <text class="cap" x="320" y="420">Say it plainly and kindly, while the list is still short.</text>
  </g>
</svg>
