<svg width="800" height="420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-slate" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#ffffff"/>

  <!-- Top label -->
  <text x="40" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#9ca3af" letter-spacing="1">CHAPTER 1 — THE THREE-SECOND WINDOW</text>

  <!-- Top rule -->
  <line x1="40" y1="48" x2="760" y2="48" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left block: THE IMPRESSION -->
  <rect x="55" y="128" width="210" height="104" rx="4" fill="#1a1a1a"/>
  <text x="160" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="1">THE IMPRESSION</text>
  <text x="160" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">what hits you before you've thought</text>
  <text x="160" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">a conscious thought</text>

  <!-- Connector line from left block to gap circle -->
  <line x1="265" y1="180" x2="348" y2="180" stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Gap circle -->
  <circle cx="390" cy="180" r="38" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="390" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" letter-spacing="0.5">PROHAIRESIS</text>
  <text x="390" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="300">3s</text>
  <text x="390" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#9ca3af" text-anchor="middle">the choice</text>

  <!-- Arrow up-right to CHOSEN -->
  <line x1="424" y1="152" x2="512" y2="108" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- CHOSEN block -->
  <rect x="518" y="72" width="200" height="72" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="618" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#b45309" text-anchor="middle" letter-spacing="1">CHOSEN</text>
  <text x="618" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#b45309" text-anchor="middle">prohairesis in use</text>

  <!-- Arrow down-right to INHERITED -->
  <line x1="424" y1="208" x2="512" y2="252" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-slate)"/>

  <!-- INHERITED block -->
  <rect x="518" y="218" width="200" height="72" rx="4" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="618" y="249" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#6b7280" text-anchor="middle" letter-spacing="1">INHERITED</text>
  <text x="618" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">the installed default</text>

  <!-- Bottom rule -->
  <line x1="40" y1="328" x2="760" y2="328" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Conversation sentence -->
  <text x="40" y="355" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#1a1a1a">Between what she says and your response is three seconds.</text>
  <text x="40" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#1a1a1a">What fills it — chosen or inherited — is your marriage.</text>

  <!-- Mechanism label bottom-right -->
  <text x="760" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#d1d5db" text-anchor="end" letter-spacing="1.5">THE GAP</text>
</svg>
