<svg class="plate" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 324 222" role="img" aria-label="Keep learning her after you&#8217;ve won her"><style>/* ------------------------------------------------------------------
   River, Oak, Sun — plate style ("Engraved Line")
   One declaration for every plate. Plates carry class names only;
   change a value here and every plate changes with it.
   Plates are drawn on a 324-unit canvas and printed at 86% of the text
   block, so the art keeps clear air on both sides. Weights and sizes below
   are in canvas units; the comments give what that prints as.
   ------------------------------------------------------------------ */

:root {
  /* Ink. One ink, no greys: tone is made from line density, never opacity. */
  --plate-ink: #111;
  --plate-paper: #fff;

  /* Three line weights (print as 0.4 / 0.7 / 1.5 pt). Nothing else is allowed. */
  --w-hair: 0.47;  /* measures, ticks, dotted "not yet" lines   */
  --w-line: 0.82;  /* the body of every drawing                  */
  --w-bold: 1.75;  /* the one thing the plate is about           */

  /* Lettering. Same face as the book body. */
  --plate-font: Georgia, 'Liberation Serif', serif;  /* exactly the book body stack, scripts/chapter_pdf_local.py (author, 2026-11-10: plates in Georgia) */
  --t-caps: 7.4px;      /* prints ~6.4pt. fixed things: what is given */
  --t-ital: 10px;       /* prints ~8.6pt. moving things: chosen, felt */
  --caps-track: 0.2em;
}

/* ---- linework ---- */
.plate        { color: var(--plate-ink); font-family: var(--plate-font); overflow: visible; }
.plate .ink   { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
.plate .hair  { stroke-width: var(--w-hair); }
.plate .line  { stroke-width: var(--w-line); }
.plate .bold  { stroke-width: var(--w-bold); }
.plate .dotted { stroke-dasharray: 0.01 2.3; }           /* latent, not yet happened */
.plate .bold.dotted { stroke-dasharray: 0.01 3.7; }                  /* heavier dots need more air */
.plate .knock { fill: var(--plate-paper); }               /* shape that clears what is behind it */
.plate .solid { fill: currentColor; stroke: none; }

/* ---- lettering inside the art ---- */
.plate text   { fill: currentColor; stroke: none; }
.plate .caps  { font-size: var(--t-caps); letter-spacing: var(--caps-track); text-transform: uppercase; font-weight: 500; }
.plate .ital  { font-size: var(--t-ital); font-style: italic; }

/* ---- plate furniture (HTML around the SVG) ---- */
figure.plate-fig            { margin: 0; text-align: center; color: var(--plate-ink); font-family: var(--plate-font); break-inside: avoid; }
.plate-fig .plate-title     { font-size: 19pt; font-weight: 400; letter-spacing: 0.01em; line-height: 1.12; margin: 0 auto 6pt; max-width: 88%; text-wrap: balance; }
.plate-fig .plate-deck      { font-size: 10pt; font-style: italic; line-height: 1.35; margin: 0 auto 26pt; text-wrap: balance; }
.plate-fig svg              { display: block; width: 86%; height: auto; margin: 0 auto; }
.plate-fig figcaption       { font-size: 10.5pt; font-style: italic; margin: 24pt 0 0; }
.plate-fig figcaption::before { content: ""; display: block; width: 18pt; border-top: 0.5pt solid currentColor; margin: 0 auto 11pt; }

/* ---- interludes: full-page drawings between the parts ---- */
.plate-fig.interlude figcaption          { font-size: 12pt; line-height: 1.5; margin-top: 30pt; }
.plate-fig.interlude figcaption::before  { display: none; }
</style>
