<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" role="img" aria-label="The Three-Second Window">
  <style>
    .ttl{font:600 17px Georgia,serif;letter-spacing:.20em;text-anchor:middle}
    .sub{font:italic 13.5px Georgia,serif;text-anchor:middle;opacity:.74}
    .el{font:600 15px Georgia,serif;letter-spacing:.18em;text-anchor:middle}
    .ql{font:italic 12px Georgia,serif;text-anchor:middle;opacity:.7}
    .bd{font:12.5px Georgia,serif;text-anchor:middle;opacity:.88}
    .lbl{font:600 12.5px Georgia,serif;letter-spacing:.14em;text-anchor:middle}
    .cap{font:italic 11.5px Georgia,serif;text-anchor:middle;opacity:.64}
    .frm{font:600 13px Georgia,serif;letter-spacing:.10em;text-anchor:middle}
    .rule{stroke:currentColor;stroke-width:.8;opacity:.26}
    .ln{stroke:currentColor;stroke-width:1.5}
  </style>
  <g fill="currentColor">
    <text class="ttl" x="330" y="40">THE THREE-SECOND WINDOW</text>
    <text class="sub" x="330" y="66">What fills it, chosen or inherited, is your marriage.</text>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.4">
    <rect x="70" y="186" width="87" height="44" fill="currentColor" stroke="none"/>
    <rect x="157" y="186" width="433" height="44" opacity=".55"/>
  </g>
  <g fill="currentColor">
    <text class="lbl" x="113" y="166">THE WINDOW</text>
    <text class="cap" x="113" y="180" style="font-size:10.5px">half a second</text>
    <text class="lbl" x="374" y="166">ALREADY FIRING</text>
    <text class="cap" x="374" y="180" style="font-size:10.5px">two and a half seconds</text>
    <text class="cap" x="70" y="256" text-anchor="start">she says something</text>
    <text class="cap" x="590" y="256" text-anchor="end">the words are already out</text>
  </g>
  <g class="rule" fill="none"><path d="M70 288v10h520v-10"/></g>
  <g fill="currentColor"><text class="lbl" x="330" y="322">THREE SECONDS</text>
    <text class="cap" x="330" y="352">The filled part is the only part you choose. It is the small one.</text></g>
</svg>
