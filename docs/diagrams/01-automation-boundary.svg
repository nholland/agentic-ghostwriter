<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-label="A chapter's seven stages in a row. The author is present at stage one, the interview, and at stage seven, the verdict. Stages two through six run cold. A dashed vertical line after the brief marks the automation boundary: past it, nothing needs the author until the verdict.">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b7884"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="300" fill="#fbfaf7"/>

  <text x="24" y="34" font-family="Georgia,'Times New Roman',serif" font-size="19" font-weight="600" fill="#17151a">Where the author is actually needed</text>
  <text x="24" y="56" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#7b7884">Seven stages. Two touches.</text>

  <!-- brackets -->
  <path d="M 24 128 L 24 122 L 124 122 L 124 128" fill="none" stroke="#b8412f" stroke-width="1.5"/>
  <text x="74" y="112" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#b8412f">YOU</text>
  <path d="M 146 128 L 146 122 L 734 122 L 734 128" fill="none" stroke="#2f5fa8" stroke-width="1.5"/>
  <text x="440" y="112" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#2f5fa8">RUNS COLD — CLOSE THE LAPTOP</text>
  <path d="M 756 128 L 756 122 L 856 122 L 856 128" fill="none" stroke="#b8412f" stroke-width="1.5"/>
  <text x="806" y="112" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#b8412f">YOU</text>

  <!-- nodes -->
  <rect x="24"  y="150" width="100" height="54" rx="6" fill="#fbfaf7" stroke="#b8412f" stroke-width="1.75"/>
  <rect x="146" y="150" width="100" height="54" rx="6" fill="#fbfaf7" stroke="#2f5fa8" stroke-width="1.75"/>
  <rect x="268" y="150" width="100" height="54" rx="6" fill="#fbfaf7" stroke="#2f5fa8" stroke-width="1.75"/>
  <rect x="390" y="150" width="100" height="54" rx="6" fill="#fbfaf7" stroke="#2f5fa8" stroke-width="1.75"/>
  <rect x="512" y="150" width="100" height="54" rx="6" fill="#fbfaf7" stroke="#2f5fa8" stroke-width="1.75"/>
  <rect x="634" y="150" width="100" height="54" rx="6" fill="#fbfaf7" stroke="#5f6470" stroke-width="1.75"/>
  <rect x="756" y="150" width="100" height="54" rx="6" fill="#fbfaf7" stroke="#b8412f" stroke-width="1.75"/>

  <g font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#17151a" text-anchor="middle">
    <text x="74"  y="182">Interview</text>
    <text x="196" y="182">Brief</text>
    <text x="318" y="182">Draft</text>
    <text x="440" y="182">Refine</text>
    <text x="562" y="182">Plate</text>
    <text x="684" y="182">Package</text>
    <text x="806" y="182">Verdict</text>
  </g>
  <g font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7b7884" text-anchor="middle">
    <text x="74"  y="222">you + the editor</text>
    <text x="196" y="222">Researcher</text>
    <text x="318" y="222">Ghostwriter</text>
    <text x="440" y="222">Line Editor</text>
    <text x="562" y="222">Designer</text>
    <text x="684" y="222">one renderer</text>
    <text x="806" y="222">you, reading</text>
  </g>

  <!-- arrows -->
  <g stroke="#7b7884" stroke-width="1.3" marker-end="url(#a1)">
    <line x1="126" y1="177" x2="142" y2="177"/>
    <line x1="248" y1="177" x2="264" y2="177"/>
    <line x1="370" y1="177" x2="386" y2="177"/>
    <line x1="492" y1="177" x2="508" y2="177"/>
    <line x1="614" y1="177" x2="630" y2="177"/>
    <line x1="736" y1="177" x2="752" y2="177"/>
  </g>

  <!-- the boundary -->
  <line x1="257" y1="132" x2="257" y2="240" stroke="#b8412f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="257" y="260" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#b8412f">the automation boundary</text>
  <text x="257" y="277" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7b7884">upstream, only you have the material</text>
</svg>
