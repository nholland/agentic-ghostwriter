<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-label="Two flows side by side. On the left, a desk writes prose and reports its own counts, and the work ships: this was wrong on three chapters and once hid a live violation. On the right, the same prose is counted by a script whose output is pasted verbatim, the Publisher runs the same script independently so a discrepancy is itself a finding, and two failed rounds send the question to the author's inbox instead of looping.">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b7884"/>
    </marker>
    <marker id="a2r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8412f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="400" fill="#fbfaf7"/>

  <text x="24" y="34" font-family="Georgia,'Times New Roman',serif" font-size="19" font-weight="600" fill="#17151a">No desk grades its own counted work</text>
  <text x="24" y="56" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#7b7884">The difference is one node, and who is allowed to report the number.</text>

  <line x1="440" y1="80" x2="440" y2="378" stroke="#dcd9d1" stroke-width="1"/>

  <!-- LEFT: the failure -->
  <text x="34" y="100" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#b8412f">WHAT FAILED</text>
  <rect x="120" y="118" width="170" height="46" rx="6" fill="#fbfaf7" stroke="#2f5fa8" stroke-width="1.75"/>
  <text x="205" y="146" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#17151a">The desk</text>
  <line x1="205" y1="166" x2="205" y2="196" stroke="#7b7884" stroke-width="1.3" marker-end="url(#a2)"/>
  <text x="215" y="185" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7b7884">writes</text>

  <rect x="120" y="200" width="170" height="46" rx="6" fill="#fbfaf7" stroke="#dcd9d1" stroke-width="1.75"/>
  <text x="205" y="228" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#17151a">The prose</text>

  <!-- self-report loop -->
  <path d="M 290 223 C 350 223 350 141 292 141" fill="none" stroke="#b8412f" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a2r)"/>
  <text x="356" y="186" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#b8412f">reports its</text>
  <text x="356" y="200" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#b8412f">own counts</text>

  <line x1="205" y1="248" x2="205" y2="278" stroke="#7b7884" stroke-width="1.3" marker-end="url(#a2)"/>
  <rect x="120" y="282" width="170" height="46" rx="6" fill="#fbfaf7" stroke="#b8412f" stroke-width="1.75"/>
  <text x="205" y="310" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#b8412f">Ships</text>
  <text x="205" y="352" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7b7884">Wrong on three chapters.</text>
  <text x="205" y="368" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7b7884">Once hid a live violation.</text>

  <!-- RIGHT: the fix -->
  <text x="474" y="100" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#2f5fa8">WHAT WORKS</text>
  <rect x="560" y="118" width="170" height="46" rx="6" fill="#fbfaf7" stroke="#2f5fa8" stroke-width="1.75"/>
  <text x="645" y="146" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#17151a">The desk</text>
  <line x1="645" y1="166" x2="645" y2="196" stroke="#7b7884" stroke-width="1.3" marker-end="url(#a2)"/>
  <text x="655" y="185" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7b7884">writes</text>

  <rect x="560" y="200" width="170" height="46" rx="6" fill="#fbfaf7" stroke="#dcd9d1" stroke-width="1.75"/>
  <text x="645" y="228" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13.5" fill="#17151a">The prose</text>
  <line x1="645" y1="248" x2="645" y2="278" stroke="#7b7884" stroke-width="1.3" marker-end="url(#a2)"/>
  <text x="655" y="267" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7b7884">counted by</text>

  <rect x="560" y="282" width="170" height="46" rx="6" fill="#fbfaf7" stroke="#5f6470" stroke-width="1.75"/>
  <text x="645" y="303" text-anchor="middle" font-family="monospace" font-size="12.5" font-weight="600" fill="#17151a">a script</text>
  <text x="645" y="319" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#7b7884">output pasted verbatim</text>

  <!-- the publisher re-runs it, stated under the panel it belongs to -->
  <text x="645" y="352" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#5f6470">the Publisher runs the same script again, independently</text>
  <text x="645" y="368" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#7b7884">a disagreement between the two reports is itself a finding</text>

  <line x1="730" y1="305" x2="790" y2="305" stroke="#b8412f" stroke-width="1.3" marker-end="url(#a2r)"/>
  <text x="800" y="296" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#b8412f">fails twice</text>
  <text x="800" y="310" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#b8412f">→ your inbox</text>
  <text x="800" y="326" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#7b7884">never a loop</text>
</svg>
